const $ = s => document.querySelector(s);
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* --- Miniatur-Sprite in eine Karte rendern --- */
function thumb(def, scale = 3) {
  scale = scale / R;
  const s = getSprite(def), c = document.createElement('canvas');
  c.width = s.base.width * scale; c.height = s.base.height * scale;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.drawImage(s.base, 0, 0, c.width, c.height);
  return c;
}

/* --- Team-Auswahl --- */
const picked = new Map();   /* Kämpfer-ID -> Gegenstand-ID */
function buildFighterGrid() {
  const g = $('#fighter-grid'); g.innerHTML = '';
  FIGHTERS.forEach(f => {
    const d = document.createElement('div'); d.className = 'card'; d.dataset.id = f.id;
    const s = statsOf(f);
    d.title = f.was;
    d.innerHTML = `<div class="chk">✔</div><div class="nm">${f.name}</div>
      <div class="tag" style="color:var(--nes-yellow)">${f.tag}</div>
      <div class="tag">${f.kurz}</div>
      <div class="tag st">HP ${s.hp} · ATK ${s.atk}<br>DEF ${s.def} · SPD ${s.spd}</div>
      <div class="itembox">
        <div class="icw"></div>
        <select class="item-pick">${ITEMS.map(i => `<option value="${i.id}">${i.name}</option>`).join('')}</select>
        <div class="tag it-desc"></div>
      </div>`;
    d.insertBefore(thumb(f, 3), d.children[1]);

    const sel = d.querySelector('.item-pick'), icw = d.querySelector('.icw'),
          desc = d.querySelector('.it-desc'), st = d.querySelector('.st');
    const paintItem = () => {
      const it = ITEM_BY_ID(sel.value), m = it.mod || {};
      icw.innerHTML = ''; if (it.build) icw.appendChild(thumb(it, 3));
      desc.textContent = it.kurz;
      if (picked.has(f.id)) picked.set(f.id, it.id);
      /* Werte inklusive Gegenstand anzeigen */
      const mark = (base, add) => add ? `<span style="color:${add > 0 ? 'var(--nes-green)' : 'var(--nes-red)'}">${base + add}</span>` : base;
      st.innerHTML = `HP ${mark(s.hp, m.hp || 0)} · ATK ${mark(s.atk, m.atk || 0)}<br>` +
                     `DEF ${mark(s.def, m.def || 0)} · SPD ${mark(s.spd, m.spd || 0)}`;
    };
    sel.onclick = e => e.stopPropagation();
    sel.onchange = e => { e.stopPropagation(); paintItem(); };
    paintItem();

    d.onclick = () => {
      if (picked.has(f.id)) picked.delete(f.id); else picked.set(f.id, sel.value);
      d.classList.toggle('sel', picked.has(f.id));
      $('#sel-count').textContent = picked.size + ' ausgewählt';
      $('#btn-to-enemy').disabled = picked.size === 0;
    };
    g.appendChild(d);
  });
}

/* --- Gegner-Auswahl --- */
const enemyCount = new Map();
function totalEnemies() { let n = 0; enemyCount.forEach(v => n += v); return n; }
const MAX_ENEMIES = 100;

function buildEnemyList() {
  const groups = [...new Set(ANIMALS.map(a => a.grp))];
  $('#enemy-group').innerHTML = '<option value="">alle Gruppen</option>' + groups.map(g => `<option>${g}</option>`).join('');
  $('#arena-pick').innerHTML = Object.entries(ARENAS).map(([k, v]) => `<option value="${k}">Arena: ${v.name}</option>`).join('');
  $('#arena-pick').onchange = e => arenaKey = e.target.value;
  renderEnemyList();
}
function renderEnemyList() {
  const q = ($('#enemy-search').value || '').toLowerCase(), grp = $('#enemy-group').value;
  const list = $('#enemy-list'); list.innerHTML = '';
  ANIMALS.filter(a => (!grp || a.grp === grp) && a.name.toLowerCase().includes(q)).forEach(a => {
    const s = animalStats(a), n = enemyCount.get(a.id) || 0;
    const row = document.createElement('div'); row.className = 'erow' + (n ? ' act' : '');
    row.innerHTML = `<div class="info">
        <div class="en">${a.name}</div>
        <div class="es">${a.kg < 1 ? (a.kg * 1000).toFixed(0) + ' g' : a.kg + ' kg'} · ${a.kmh} km/h</div>
        <div class="es">HP ${s.hp} ATK ${s.atk} DEF ${s.def}</div>
      </div>
      <div class="stepper"><button data-d="-1">−</button><span class="cnt">${n}</span><button data-d="1">+</button></div>`;
    row.insertBefore(thumb(a, 2), row.firstChild);
    row.querySelectorAll('button').forEach(b => b.onclick = () => {
      const d = +b.dataset.d, cur = enemyCount.get(a.id) || 0;
      let nv = Math.max(0, cur + d);
      if (d > 0 && totalEnemies() >= MAX_ENEMIES) nv = cur;
      nv ? enemyCount.set(a.id, nv) : enemyCount.delete(a.id);
      row.querySelector('.cnt').textContent = nv;
      row.classList.toggle('act', !!nv);
      updateEnemyHeader();
    });
    list.appendChild(row);
  });
}
function updateEnemyHeader() {
  const t = totalEnemies();
  $('#enemy-count').textContent = t + ' Gegner' + (t >= MAX_ENEMIES ? ' (max)' : '');
  $('#btn-fight').disabled = t === 0;
}

/* ============================================================
   9) RENDERING + KAMPFSCHLEIFE
   ============================================================ */
const cv = $('#stage');
const mainCtx = cv.getContext('2d'); mainCtx.imageSmoothingEnabled = false;
let ctx = mainCtx;                     /* wird für die Zeitlupe umgehängt */
const W = 640, H = 360, HZ = 112;
/* Offscreen-Puffer: in der Zeitlupe wird die Szene dorthin gezeichnet und
   anschliessend vergrössert aufs sichtbare Canvas geblittet. */
const scene = document.createElement('canvas'); scene.width = W; scene.height = H;
const sctx = scene.getContext('2d'); sctx.imageSmoothingEnabled = false;
const sxOf = u => 40 + u.x * (W - 80);
const syOf = u => 150 + u.y * 176;
/* scOf ist die Skalierung pro ECHTEM Pixel, s24 die pro Design-Einheit */
const scOf = u => (1.9 + u.y * 1.35) * (u.vis || 1) / R;

let arenaT = 0;   /* läuft immer, unabhängig vom Kampfzustand */

function drawBg() {
  const a = ARENAS[arenaKey];
  const g = ctx.createLinearGradient(0, 0, 0, HZ);
  g.addColorStop(0, a.sky[0]); g.addColorStop(1, a.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ);
  ctx.fillStyle = a.ground; ctx.fillRect(0, HZ, W, H - HZ);
  ctx.fillStyle = a.groundDark; ctx.fillRect(0, HZ, W, 3);
  a.deco(ctx, W, H, HZ, arenaT);
}

/* Vordergrund-Ebene: läuft VOR den Kämpfern (Passanten, Blitz, Wolkenfetzen) */
function drawFore() {
  const a = ARENAS[arenaKey];
  if (a.fore) a.fore(ctx, W, H, HZ, arenaT);
}

function drawUnit(u, dx = 0) {
  const x = sxOf(u) + dx, y = syOf(u), s = scOf(u);
  const lean = u.lunge * (u.side === 0 ? 7 : -7);
  ctx.globalAlpha = .28; ctx.fillStyle = '#000';
  const s24 = s * R;
  ctx.beginPath(); ctx.ellipse(x, y + 1, 9 * s24 * .6, 3 * s24 * .6, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  drawSprite(ctx, u.def, x + lean, y, s, u.side === 1, false);
  if (u.flash > 0) {
    ctx.globalAlpha = Math.min(.72, u.flash * 7);
    drawSprite(ctx, u.def, x + lean, y, s, u.side === 1, true);
    ctx.globalAlpha = 1;
  }
  /* mitgebrachter Gegenstand in der Hand */
  if (u.item && u.item.build) {
    const dir = u.side === 0 ? 1 : -1;
    drawSprite(ctx, u.item, x + lean + dir * 5.6 * s24, y - 6.2 * s24, s * .68, u.side === 1, false);
  }

  /* Mini-HP */
  const spr = getSprite(u.def);
  const bw = Math.max(10, Math.round(18 * s24 * .5)), bx = Math.round(x - bw / 2);
  const by = Math.round(y - (SH - spr.top) * s - 5);
  ctx.fillStyle = '#000'; ctx.fillRect(bx - 1, by - 1, bw + 2, 4);
  const p = u.hp / u.maxHp;
  ctx.fillStyle = p > .5 ? '#58d858' : p > .22 ? '#fcd000' : '#e0403a';
  ctx.fillRect(bx, by, Math.max(1, Math.round(bw * p)), 2);
}

function drawFx() {
  ctx.textAlign = 'center';
  for (const f of world.fx) {
    const x = 40 + f.x * (W - 80), y = 150 + f.y * 176;
    if (f.k === 'dmg') {
      const up = (1 - f.life / .9) * 26;
      ctx.font = (f.crit ? 'bold 15px' : '12px') + ' "Press Start 2P", monospace';
      ctx.globalAlpha = Math.min(1, f.life * 2.6);
      ctx.fillStyle = '#000'; ctx.fillText(f.v, x + 1, y - 26 - up + 1);
      ctx.fillStyle = f.crit ? '#fcd000' : '#fff'; ctx.fillText(f.v, x, y - 26 - up);
      ctx.globalAlpha = 1;
    } else if (f.k === 'txt') {
      const up = (1 - f.life / .7) * 20;
      ctx.font = '8px "Press Start 2P", monospace';
      ctx.globalAlpha = Math.min(1, f.life * 3);
      ctx.fillStyle = '#000'; ctx.fillText(f.s, x + 1, y - 30 - up + 1);
      ctx.fillStyle = f.col || '#fff'; ctx.fillText(f.s, x, y - 30 - up);
      ctx.globalAlpha = 1;
    } else if (f.k === 'poof') {
      const r = (1 - f.life / .5) * 16;
      ctx.globalAlpha = f.life * 2; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y - 10, r + 3, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
}

function banner(txt, sub, col) {
  ctx.textAlign = 'center';
  ctx.font = '30px "Press Start 2P", monospace';
  ctx.fillStyle = '#000'; ctx.fillText(txt, W / 2 + 3, H / 2 + 3);
  ctx.fillStyle = col; ctx.fillText(txt, W / 2, H / 2);
  if (sub) { ctx.font = '10px "Press Start 2P", monospace'; ctx.fillStyle = '#fff'; ctx.fillText(sub, W / 2, H / 2 + 28); }
}

let world = null, phase = 'idle', pt = 0, speed = 1, raf = 0, logIdx = 0, lastTs = 0;
let paused = false;

function setSpeed(v) {
  speed = v;
  document.querySelectorAll('.spd').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
}
function setPaused(p) {
  paused = p;
  $('#btn-pause').textContent = p ? '▶ Weiter' : '❚❚ Pause';
  $('#btn-pause').className = p ? 'primary' : '';
}

function teamLabel(side) {
  if (side === 0) return [...picked.keys()].map(id => FIGHTERS.find(f => f.id === id).name).join(' + ');
  const parts = []; enemyCount.forEach((n, id) => parts.push(n + '× ' + ANIMALS.find(a => a.id === id).name));
  return parts.join(' + ');
}

function startBattle() {
  const team = [...picked].map(([id, item]) => ({ def: FIGHTERS.find(f => f.id === id), item }));
  const foes = []; enemyCount.forEach((n, id) => foes.push({ def: ANIMALS.find(a => a.id === id), n }));
  world = createWorld(team, foes);
  phase = 'intro'; pt = 0; logIdx = 0; lastTs = 0; setPaused(false);
  $('#log').innerHTML = '';
  $('#hp-a-name').textContent = teamLabel(0);
  $('#hp-b-name').textContent = teamLabel(1);
  updateHud();
  show('scr-battle');
  cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
}

function updateHud() {
  [0, 1].forEach(side => {
    const us = world.units.filter(u => u.side === side);
    const hp = us.reduce((s, u) => s + u.hp, 0), mx = us.reduce((s, u) => s + u.maxHp, 0);
    const p = mx ? hp / mx : 0, el = $(side === 0 ? '#hp-a' : '#hp-b');
    el.style.width = (p * 100).toFixed(1) + '%';
    el.className = 'hpfill' + (p > .5 ? '' : p > .22 ? ' mid' : ' low');
    $(side === 0 ? '#hp-a-sub' : '#hp-b-sub').textContent =
      `${us.filter(u => u.alive).length}/${us.length} am Leben · ${Math.round(hp)} HP`;
  });
}

function flushLog() {
  const box = $('#log');
  while (logIdx < world.log.length) {
    const e = world.log[logIdx++];
    const d = document.createElement('div');
    d.className = e.c || ''; d.textContent = '› ' + e.s;
    box.appendChild(d);
  }
  while (box.children.length > 120) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

/* Die Kampfschleife macht selbst keine Geraeusche. Der Ton haengt an den
   Effekten, die sie erzeugt — so bleibt fastSim() lautlos. */
function sfxFromFx() {
  for (const f of world.fx) {
    if (f._snd) continue;
    f._snd = 1;
    if (f.k === 'dmg') { f.sp ? SFX.special() : f.crit ? SFX.crit() : SFX.hit(f.v); }
    else if (f.k === 'poof') SFX.ko();
    else if (f.k === 'txt') {
      if (f.s === 'DANEBEN') SFX.miss();
      else if (f.s === 'BLOCK') SFX.block();
      else SFX.dodge();
    }
  }
}

function pauseOverlay() {
  if (!paused) return;
  ctx.fillStyle = 'rgba(5,7,13,.45)'; ctx.fillRect(0, 0, W, H);
  banner('PAUSE', 'Leertaste oder Button', '#fcd000');
}

function frame(ts) {
  raf = requestAnimationFrame(frame);
  const raw = lastTs ? Math.min(.05, (ts - lastTs) / 1000) : 1 / 60; lastTs = ts;
  const dt = paused ? 0 : raw;      /* Pause friert Kampf UND Arena ein */
  arenaT += dt;
  ctx = phase === 'slowmo' ? sctx : mainCtx;
  drawBg();

  if (phase === 'intro') {
    pt += dt;
    const p = Math.min(1, pt / 1.1), e = 1 - Math.pow(1 - p, 3);
    const units = [...world.units].sort((a, b) => syOf(a) - syOf(b));
    units.forEach(u => drawUnit(u, (u.side === 0 ? -1 : 1) * (1 - e) * 340));
    drawFore();
    if (pt > .5 && pt < 1.9) banner('VS', teamLabel(0).slice(0, 28) + '  —  ' + teamLabel(1).slice(0, 28), '#fcd000');
    if (pt >= 1.9) banner('FIGHT!', '', '#e0403a');
    pauseOverlay();
    if (pt > 2.5) {
      phase = 'fight';
      world.units.filter(u => u.side === 0 && u.item && u.item.id !== 'none')
        .forEach(u => world.log.push({ c: 'spc', s: `${u.name} bringt ${u.item.name === 'Bierbank' ? 'eine' : 'einen'} ${u.item.name} mit.` }));
      world.log.push({ c: 'hit', s: 'KAMPF!' });
      SFX.fight();
    }
    return;
  }

  if (phase === 'fight') {
    for (let i = 0; i < speed; i++) if (!world.over) step(world, dt);
    const units = [...world.units].filter(u => u.alive).sort((a, b) => syOf(a) - syOf(b));
    units.forEach(u => drawUnit(u));
    drawFx(); drawFore(); updateHud(); flushLog(); sfxFromFx();
    pauseOverlay();
    if (world.over) { phase = 'slowmo'; pt = 0; SFX.finish(); }
    return;
  }

  /* Zeitlupe auf den letzten K.O. — Zeit auf ein Fünftel, Kamera fährt rein */
  if (phase === 'slowmo') {
    pt += raw;
    const sdt = dt * .2;
    for (let i = world.fx.length - 1; i >= 0; i--) { world.fx[i].life -= sdt; if (world.fx[i].life <= 0) world.fx.splice(i, 1); }
    for (const u of world.units) u.flash = Math.max(0, u.flash - sdt);
    [...world.units].filter(u => u.alive).sort((a, b) => syOf(a) - syOf(b)).forEach(u => drawUnit(u));
    drawFx(); drawFore();

    ctx = mainCtx;
    const p = Math.min(1, pt / .55);
    const z = Math.max(1.0001, 1 + 1.05 * (1 - Math.pow(1 - p, 3)));
    const fxp = world.lastKO ? 40 + world.lastKO.x * (W - 80) : W / 2;
    const fyp = world.lastKO ? 150 + world.lastKO.y * 176 : H / 2;
    /* Fokus so begrenzen, dass das vergrösserte Bild das Canvas noch füllt */
    const hw = W / (2 * z), hh = H / (2 * z);
    const cxp = Math.max(hw, Math.min(W - hw, fxp)), cyp = Math.max(hh, Math.min(H - hh, fyp));
    mainCtx.save();
    mainCtx.translate(W / 2, H / 2); mainCtx.scale(z, z); mainCtx.translate(-cxp, -cyp);
    mainCtx.drawImage(scene, 0, 0);
    mainCtx.restore();
    const vg = mainCtx.createRadialGradient(W / 2, H / 2, H * .22, W / 2, H / 2, H * .85);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
    mainCtx.fillStyle = vg; mainCtx.fillRect(0, 0, W, H);
    pauseOverlay();
    if (pt > 1.5) { phase = 'end'; pt = 0; }
    return;
  }

  if (phase === 'end') {
    pt += dt;
    [...world.units].filter(u => u.alive).sort((a, b) => syOf(a) - syOf(b)).forEach(u => drawUnit(u));
    drawFx(); drawFore();
    banner('K.O.', '', '#fcd000');
    pauseOverlay();
    if (pt > .9) { cancelAnimationFrame(raf); showResult(); }
  }
}

/* ============================================================
   10) ABSCHLUSSBERICHT  (Text + Bild, teilbar übers Sharesheet)
   ============================================================ */
function buildReport(w) {
  const st = w.stats;
  const team = w.units.filter(u => u.side === 0), foes = w.units.filter(u => u.side === 1);
  const aliveA = team.filter(u => u.alive), aliveB = foes.filter(u => u.alive);
  const byDmg = [...w.units].sort((a, b) => b.dealt - a.dealt);
  const byKill = [...w.units].sort((a, b) => b.kills - a.kills);
  const tank = [...team].sort((a, b) => (b.taken || 0) - (a.taken || 0))[0];

  /* Gegner nach Art zusammenfassen */
  const kinds = new Map();
  foes.forEach(u => {
    const e = kinds.get(u.name) || { n: 0, down: 0 };
    e.n++; if (!u.alive) e.down++; kinds.set(u.name, e);
  });

  return {
    datum: new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }),
    arena: ARENAS[arenaKey].name,
    teamLabel: teamLabel(0), foeLabel: teamLabel(1),
    sieg: w.winner === 0, unentschieden: w.winner === -1,
    dauer: w.t.toFixed(1),
    teamAlive: aliveA.length, teamTotal: team.length,
    foeAlive: aliveB.length, foeTotal: foes.length,
    ueberlebende: aliveA.map(u => `${u.name} (${Math.round(u.hp)}/${u.maxHp} HP)`),
    gefallen: team.filter(u => !u.alive).map(u => u.name),
    kinds: [...kinds].map(([n, e]) => `${e.down}/${e.n} ${n}`),
    ausruestung: team.filter(u => u.item && u.item.id !== 'none').map(u => `${u.name}: ${u.item.name}`),
    mvp: byDmg[0], topKill: byKill[0], tank,
    hits: st.hits, kos: st.kos, dmg: Math.round(st.dmg), specials: st.specials, crit: st.crit,
    lucky: st.lucky, miss: st.miss, dodge: st.dodge, block: st.block, best: st.best,
    dps: w.t > 0 ? Math.round(st.dmg / w.t) : 0,
    team, foes
  };
}

function reportText(r) {
  const L = [];
  L.push('ANIMAL BOXING — ABSCHLUSSBERICHT');
  L.push(`${r.datum} · Arena: ${r.arena}`);
  L.push('');
  L.push(`${r.teamLabel}`);
  L.push(`  gegen  ${r.foeLabel}`);
  L.push('');
  L.push(r.unentschieden ? 'ERGEBNIS: UNENTSCHIEDEN'
    : r.sieg ? `ERGEBNIS: TEAM GEWINNT nach ${r.dauer}s`
             : `ERGEBNIS: TEAM VERLIERT nach ${r.dauer}s`);
  L.push('');
  L.push(`Team übrig:    ${r.teamAlive}/${r.teamTotal}`);
  if (r.ueberlebende.length) L.push('  ' + r.ueberlebende.join(', '));
  if (r.gefallen.length) L.push('  Gefallen: ' + r.gefallen.join(', '));
  L.push(`Gegner erledigt: ${r.foeTotal - r.foeAlive}/${r.foeTotal}`);
  r.kinds.forEach(k => L.push('  ' + k + ' erledigt'));
  if (r.ausruestung.length) { L.push(''); L.push('Ausrüstung:'); r.ausruestung.forEach(a => L.push('  ' + a)); }
  L.push('');
  L.push(`Meister Schaden:  ${r.mvp.name} (${Math.round(r.mvp.dealt)})`);
  L.push(`Meiste K.O.s:     ${r.topKill.name} (${r.topKill.kills})`);
  if (r.tank) L.push(`Meiste Prügel:    ${r.tank.name} (${Math.round(r.tank.taken || 0)} eingesteckt)`);
  if (r.best.v) L.push(`Härtester Treffer: ${r.best.v} — ${r.best.by} auf ${r.best.on}`);
  L.push('');
  L.push(`Angriffe: ${r.hits} · K.O.s beidseitig: ${r.kos} · Schaden: ${r.dmg} (${r.dps}/s)`);
  L.push(`Specials: ${r.specials} · Krits: ${r.crit} · Glückstreffer: ${r.lucky}`);
  L.push(`Danebengehauen: ${r.miss} · Ausgewichen: ${r.dodge} · Geblockt: ${r.block}`);
  L.push('');
  L.push('Keine Tiere wurden verletzt. Sie sind alle nur Pixel.');
  return L.join('\n');
}

function reportCanvas(r) {
  const W2 = 520, pad = 18;
  const rows = [
    ['Dauer', r.dauer + 's'],
    ['Team übrig', `${r.teamAlive}/${r.teamTotal}`],
    ['Gegner erledigt', `${r.foeTotal - r.foeAlive}/${r.foeTotal}`],
    ['Angriffe gelandet', String(r.hits)],
    ['K.O.s (beide Seiten)', String(r.kos)],
    ['Schaden gesamt', `${r.dmg}  (${r.dps}/s)`],
    ['Specials', String(r.specials)],
    ['Krits / Glück', `${r.crit} / ${r.lucky}`],
    ['Daneben / Block', `${r.miss} / ${r.block}`]
  ];
  const H2 = 226 + rows.length * 17 + 82 + (r.ausruestung.length ? Math.min(4, r.ausruestung.length) * 15 + 8 : 0);
  const c = document.createElement('canvas');
  c.width = W2; c.height = H2;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;

  const F1 = n => `${n}px "Press Start 2P", monospace`;
  const txt = (t, px2, py, size, col, align = 'left') => {
    x.font = F1(size); x.textAlign = align; x.fillStyle = col; x.fillText(t, px2, py);
  };

  x.fillStyle = '#141a2e'; x.fillRect(0, 0, W2, H2);
  x.fillStyle = '#1b2440'; x.fillRect(0, 0, W2, 78);
  x.fillStyle = '#fcd000'; x.fillRect(0, 76, W2, 2);

  txt('ANIMAL BOXING', W2 / 2, 32, 15, '#fcd000', 'center');
  txt('ABSCHLUSSBERICHT', W2 / 2, 52, 8, '#8fa3c8', 'center');
  txt(`${r.datum}  ·  ARENA: ${r.arena.toUpperCase()}`, W2 / 2, 68, 7, '#8fa3c8', 'center');

  /* Aufstellung: Team links, Gegner rechts */
  const sc = 1.6 / R, rowY = 152;
  r.team.slice(0, 4).forEach((u, i) => drawSprite(x, u.def, pad + 22 + i * 34, rowY, sc, false, false));
  const foeKinds = [...new Set(r.foes.map(u => u.def))].slice(0, 4);
  foeKinds.forEach((d, i) => drawSprite(x, d, W2 - pad - 22 - i * 34, rowY, sc, true, false));
  txt('VS', W2 / 2, rowY - 14, 11, '#e0403a', 'center');

  const cut = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;
  txt(cut(r.teamLabel, 26), pad, rowY + 16, 7, '#e8f0ff');
  txt(cut(r.foeLabel, 26), W2 - pad, rowY + 16, 7, '#e8f0ff', 'right');

  /* Ergebnisbanner */
  const col = r.unentschieden ? '#fcd000' : r.sieg ? '#58d858' : '#e0403a';
  const label = r.unentschieden ? 'UNENTSCHIEDEN' : r.sieg ? 'TEAM GEWINNT' : 'TEAM VERLIERT';
  x.fillStyle = '#0b0f1a'; x.fillRect(pad, rowY + 26, W2 - pad * 2, 30);
  x.fillStyle = col; x.fillRect(pad, rowY + 26, 4, 30);
  txt(label, W2 / 2, rowY + 46, 12, col, 'center');

  /* Zahlenblock */
  let y = rowY + 78;
  rows.forEach(([k, v], i) => {
    if (i % 2 === 0) { x.fillStyle = '#19203a'; x.fillRect(pad, y - 11, W2 - pad * 2, 17); }
    txt(k, pad + 6, y, 7, '#8fa3c8');
    txt(v, W2 - pad - 6, y, 7, '#e8f0ff', 'right');
    y += 17;
  });

  y += 12;
  txt('MEISTER SCHADEN', pad, y, 7, '#8fa3c8');
  txt(`${cut(r.mvp.name, 16)}  ${Math.round(r.mvp.dealt)}`, W2 - pad, y, 7, '#fcd000', 'right'); y += 16;
  txt('MEISTE K.O.s', pad, y, 7, '#8fa3c8');
  txt(`${cut(r.topKill.name, 16)}  ${r.topKill.kills}`, W2 - pad, y, 7, '#fcd000', 'right'); y += 16;
  if (r.ausruestung.length) {
    y += 4;
    r.ausruestung.slice(0, 4).forEach((a, i) => {
      txt(i === 0 ? 'AUSRÜSTUNG' : '', pad, y, 7, '#8fa3c8');
      txt(cut(a, 32), W2 - pad, y, 7, '#e8f0ff', 'right'); y += 15;
    });
    y += 4;
  }
  if (r.best.v) {
    txt('HÄRTESTER TREFFER', pad, y, 7, '#8fa3c8');
    txt(`${r.best.v}  ${cut(r.best.by, 12)}`, W2 - pad, y, 7, '#fcd000', 'right'); y += 16;
  }
  txt('Keine Tiere wurden verletzt. Sie sind alle nur Pixel.', W2 / 2, H2 - 10, 6, '#5b6a8c', 'center');
  return c;
}

let lastReport = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.textContent = ''; }, 4000);
}
const reportBlob = cv => new Promise(res => cv.toBlob(res, 'image/png'));

async function shareReport() {
  if (!lastReport) return;
  const text = reportText(lastReport);
  try {
    const blob = await reportBlob(lastReport.canvas);
    const file = new File([blob], 'animal-boxing-bericht.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Animal Boxing', text });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    if (navigator.share) { await navigator.share({ title: 'Animal Boxing', text }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  copyReport();
}
async function copyReport() {
  if (!lastReport) return;
  const text = reportText(lastReport);
  try { await navigator.clipboard.writeText(text); toast('Bericht in die Zwischenablage kopiert.'); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'width:100%;height:180px;font-size:9px;background:#05070d;color:#e8f0ff;border:3px solid #3a4870';
    $('#report-wrap').prepend(ta); ta.select();
    toast('Teilen ging nicht — Text steht oben zum Kopieren.');
  }
}
function saveReport() {
  if (!lastReport) return;
  const a = document.createElement('a');
  a.download = 'animal-boxing-bericht.png';
  a.href = lastReport.canvas.toDataURL('image/png');
  a.click();
  toast('Bild gespeichert.');
}

function showResult() {
  const winner = world.winner;
  const team = world.units.filter(u => u.side === 0), foes = world.units.filter(u => u.side === 1);
  const alive = s => world.units.filter(u => u.side === s && u.alive);
  const mvp = [...world.units].sort((a, b) => b.dealt - a.dealt)[0];
  const topKill = [...world.units].sort((a, b) => b.kills - a.kills)[0];

  (winner === 0 ? SFX.win : SFX.lose)();
  $('#res-title').textContent = winner === 0 ? 'TEAM GEWINNT!' : winner === 1 ? 'TEAM VERLIERT.' : 'UNENTSCHIEDEN';
  $('#res-title').style.color = winner === 0 ? '#58d858' : winner === 1 ? '#e0403a' : '#fcd000';

  const verdicts = winner === 0
    ? ['Die Natur hat verloren.', 'Das war knapper als es aussah.', 'Bitte nicht zuhause nachmachen.', 'Die Tiere legen Widerspruch ein.']
    : ['Die Natur bleibt ungeschlagen.', 'Vielleicht nächstes Mal weniger Gegner.', 'Das war vorhersehbar.', 'Wir hätten es wissen müssen.'];
  $('#res-sub').textContent = verdicts[Math.floor(Math.random() * verdicts.length)];

  $('#res-stats').innerHTML = `
    <div class="statline">Dauer: <b>${world.t.toFixed(1)}s</b></div>
    <div class="statline">Team übrig: <b>${alive(0).length}/${team.length}</b>${alive(0).length ? ' (' + alive(0).map(u => u.name + ' ' + Math.round(u.hp) + 'HP').join(', ') + ')' : ''}</div>
    <div class="statline">Gegner übrig: <b>${alive(1).length}/${foes.length}</b></div>
    <div class="statline">Meister Schaden: <b>${mvp.name}</b> mit ${Math.round(mvp.dealt)} Schaden</div>
    <div class="statline">Meiste K.O.s: <b>${topKill.name}</b> (${topKill.kills})</div>`;

  /* Abschlussbericht bauen und anzeigen */
  lastReport = buildReport(world);
  const draw = () => {
    lastReport.canvas = reportCanvas(lastReport);
    const wrap = $('#report-wrap'); wrap.innerHTML = ''; wrap.appendChild(lastReport.canvas);
  };
  draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw).catch(() => {});
  $('#toast').textContent = '';
  show('scr-result');
}

/* --- Verdrahtung --- */
$('#btn-start').onclick = () => show('scr-select');
$('#btn-back-title').onclick = () => show('scr-title');
$('#btn-to-enemy').onclick = () => { updateEnemyHeader(); show('scr-enemy'); };
$('#btn-back-select').onclick = () => show('scr-select');
$('#btn-fight').onclick = startBattle;
$('#btn-abort').onclick = () => { cancelAnimationFrame(raf); phase = 'idle'; show('scr-enemy'); };
$('#btn-share').onclick = shareReport;
$('#btn-save').onclick = saveReport;
$('#btn-copy').onclick = copyReport;
$('#btn-rematch').onclick = startBattle;
$('#btn-new').onclick = () => show('scr-select');
$('#btn-clear-enemies').onclick = () => { enemyCount.clear(); renderEnemyList(); updateEnemyHeader(); };
$('#enemy-search').oninput = renderEnemyList;
$('#enemy-group').onchange = renderEnemyList;
document.querySelectorAll('.spd').forEach(b => b.onclick = () => setSpeed(+b.dataset.v));
$('#btn-pause').onclick = () => setPaused(!paused);
$('#btn-snap').onclick = () => {
  const a = document.createElement('a');
  a.download = 'animal-boxing.png'; a.href = cv.toDataURL('image/png'); a.click();
};
document.addEventListener('keydown', e => {
  if (!$('#scr-battle').classList.contains('on')) return;
  if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); }
  if (e.key === '1') setSpeed(1);

function paintMute() { $('#btn-mute').textContent = SFX.muted ? 'Ton aus' : 'Ton an'; $('#btn-mute').classList.toggle('on', !SFX.muted); }
$('#btn-mute').onclick = () => { SFX.toggle(); paintMute(); };
paintMute();

/* Kleiner Klick auf jedem Button — öffnet nebenbei den AudioContext,
   den der Browser sonst erst nach einer Nutzergeste erlaubt. */
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && b.id !== 'btn-mute') SFX.ui();
}, true);
  if (e.key === '2') setSpeed(2);
  if (e.key === '4') setSpeed(4);
});
setSpeed(1);

function paintMute() { $('#btn-mute').textContent = SFX.muted ? 'Ton aus' : 'Ton an'; $('#btn-mute').classList.toggle('on', !SFX.muted); }
$('#btn-mute').onclick = () => { SFX.toggle(); paintMute(); };
paintMute();

/* Kleiner Klick auf jedem Button — öffnet nebenbei den AudioContext,
   den der Browser sonst erst nach einer Nutzergeste erlaubt. */
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && b.id !== 'btn-mute') SFX.ui();
}, true);

function buildRoleList() {
  $('#roles-body').innerHTML = Object.entries(ROLES).map(([k, r]) => `
    <div style="display:flex;gap:10px;padding:8px 0;border-bottom:2px solid #2a3450">
      <div style="min-width:118px">
        <div style="font-size:9px;color:var(--nes-yellow);line-height:1.6">${r.name}</div>
        <div style="font-size:7px;color:var(--nes-dim);line-height:1.6">${r.kurz}</div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:8px;line-height:1.9;color:var(--nes-ink)">${r.was}</div>
        <div style="font-size:7px;color:var(--nes-dim);line-height:1.8;margin-top:4px">
          HP ${r.hp} · ATK ${r.atk} · DEF ${r.def} · SPD ${r.spd} &nbsp;|&nbsp; ★ ${r.special.n}
        </div>
      </div>
    </div>`).join('');
}
$('#roles-toggle').onclick = () => {
  const b = $('#roles-body'), open = b.style.display === 'none';
  b.style.display = open ? 'block' : 'none';
  $('#roles-arrow').textContent = open ? '▲ zuklappen' : '▼ aufklappen';
};

buildRoleList();
buildFighterGrid();
buildEnemyList();
updateEnemyHeader();
/* Voreinstellung fürs Demo: 20 Chihuahuas */
enemyCount.set('chihuahua', 20); renderEnemyList(); updateEnemyHeader();
</script>
