<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIMAL BOXING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --nes-bg:#0b0f1a; --nes-panel:#1b2440; --nes-panel2:#111a30;
  --nes-ink:#e8f0ff; --nes-dim:#8fa3c8;
  --nes-red:#e0403a; --nes-green:#58d858; --nes-yellow:#fcd000; --nes-blue:#3cbcfc;
  --nes-border:#f8f8f8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#05070d;color:var(--nes-ink);
  font-family:"Press Start 2P",ui-monospace,"Courier New",monospace;
  -webkit-font-smoothing:none; image-rendering:pixelated;}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding-block:16px;padding-left:16px;padding-right:16px;gap:12px;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);}
#app{width:100%;max-width:920px;display:flex;flex-direction:column;gap:12px}

h1{font-size:clamp(16px,4.2vw,34px);margin:0;line-height:1.35;text-align:center;
  color:var(--nes-yellow);text-shadow:3px 3px 0 #a02020,6px 6px 0 rgba(0,0,0,.5);letter-spacing:1px}
.sub{font-size:9px;color:var(--nes-dim);text-align:center;line-height:1.8}

.panel{background:var(--nes-panel);border:4px solid var(--nes-border);
  box-shadow:0 0 0 4px #000, 6px 6px 0 rgba(0,0,0,.55);padding:14px}
.panel.dark{background:var(--nes-panel2)}

button,.btn{font-family:inherit;font-size:10px;line-height:1.6;cursor:pointer;
  background:var(--nes-blue);color:#06101e;border:3px solid #fff;
  box-shadow:0 0 0 3px #000,4px 4px 0 rgba(0,0,0,.6);padding:10px 14px;
  transition:transform .04s}
button:active,.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 3px #000,2px 2px 0 rgba(0,0,0,.6)}
button:disabled{background:#4a5470;color:#8e97ac;cursor:not-allowed;box-shadow:0 0 0 3px #000}
button.primary{background:var(--nes-yellow)}
button.on{background:var(--nes-yellow);color:#06101e;border-color:#fff}
button.danger{background:var(--nes-red);color:#fff}
button.ghost{background:transparent;color:var(--nes-ink);border-color:var(--nes-dim)}

.screen{display:none;flex-direction:column;gap:12px}
.screen.on{display:flex}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.grow{flex:1 1 auto}

.grid-fighters{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.card{background:var(--nes-panel2);border:3px solid #3a4870;padding:8px;
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative}
.card:hover{border-color:var(--nes-blue)}
.card.sel{border-color:var(--nes-yellow);background:#2a3358;box-shadow:inset 0 0 0 2px var(--nes-yellow)}
.card .nm{font-size:9px;text-align:center;line-height:1.5}
.card .tag{font-size:7px;color:var(--nes-dim);text-align:center;line-height:1.6}
.card canvas{image-rendering:pixelated}
.card .chk{position:absolute;top:4px;right:6px;font-size:10px;color:var(--nes-yellow);display:none}
.card .itembox{display:none;flex-direction:column;align-items:center;gap:4px;width:100%;
  border-top:2px solid #3a4870;padding-top:6px;margin-top:2px}
.card.sel .itembox{display:flex}
.card .itembox select{font-family:inherit;font-size:7px;padding:4px;width:100%;
  background:#0b1120;color:var(--nes-ink);border:2px solid #3a4870}
.card .icw{height:44px;display:flex;align-items:center;justify-content:center}
.card .icw canvas{image-rendering:pixelated}
.card .it-desc{font-size:6px;line-height:1.7;color:var(--nes-green);min-height:12px}
.card.sel .chk{display:block}

.enemy-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;
  max-height:46vh;overflow-y:auto;padding-right:6px}
.erow{display:flex;align-items:center;gap:8px;background:var(--nes-panel2);
  border:3px solid #3a4870;padding:6px}
.erow.act{border-color:var(--nes-yellow)}
.erow .info{flex:1;min-width:0}
.erow .en{font-size:8px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .es{font-size:7px;color:var(--nes-dim);line-height:1.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{padding:4px 7px;font-size:9px;box-shadow:0 0 0 2px #000}
.stepper .cnt{font-size:9px;min-width:22px;text-align:center;color:var(--nes-yellow)}

.filterbar input,.filterbar select{font-family:inherit;font-size:9px;padding:8px;
  background:#0b1120;color:var(--nes-ink);border:3px solid #3a4870}

#stage{width:100%;image-rendering:pixelated;display:block;
  border:4px solid var(--nes-border);box-shadow:0 0 0 4px #000;background:#0d1020}

.hpwrap{display:flex;flex-direction:column;gap:4px;flex:1 1 220px;min-width:0}
.hpname{font-size:8px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpbar{height:14px;background:#000;border:3px solid #fff;box-shadow:0 0 0 2px #000;position:relative;overflow:hidden}
.hpfill{height:100%;width:100%;background:var(--nes-green);transition:width .18s linear}
.hpfill.mid{background:var(--nes-yellow)}
.hpfill.low{background:var(--nes-red)}

#report-wrap canvas{width:100%;max-width:520px;image-rendering:pixelated;
  border:3px solid var(--nes-border);box-shadow:0 0 0 3px #000;display:block}
#log{height:104px;overflow-y:auto;background:#05070d;border:3px solid #3a4870;
  padding:8px;font-size:8px;line-height:1.9;color:var(--nes-dim)}
#log b{color:var(--nes-ink)}
#log .hit{color:var(--nes-yellow)}
#log .ko{color:var(--nes-red)}
#log .spc{color:var(--nes-blue)}

.blink{animation:bl 1s steps(2,start) infinite}
@keyframes bl{to{visibility:hidden}}

.result h2{font-size:20px;text-align:center;margin:6px 0;line-height:1.5}
.statline{font-size:9px;line-height:2.1;color:var(--nes-dim)}
.statline b{color:var(--nes-yellow)}

@media (max-width:520px){
  .enemy-list{grid-template-columns:1fr;max-height:40vh}
  #log{height:84px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   1) PIXEL-RASTERIZER
   Sprites werden nicht als Strings gemalt, sondern aus Primitiven
   (Ellipse/Rechteck/Dreieck) auf ein 24x24-Raster gerastert.
   ============================================================ */
/* Die Baupläne rechnen in einem 24x24-DESIGN-Raster. R sagt, wie viele
   echte Pixel eine Design-Einheit bekommt — höheres R = mehr Detail,
   ohne dass ein einziger Bauplan angefasst werden muss. */
const R = 3;
const DW = 24, DH = 24, GROUND_Y = 21;
const SW = DW * R, SH = DH * R;

/* Design-Koordinate -> echte Pixelmitte */
const mp = v => v * R + (R - 1) / 2;

const newGrid = (w = SW, h = SH) =>
  Array.from({ length: h }, () => new Array(w).fill('.'));

function rawPx(g, x, y, c) {
  x = Math.round(x); y = Math.round(y);
  if (y < 0 || y >= g.length || x < 0 || x >= g[0].length) return;
  g[y][x] = c;
}
/* Ein Design-Pixel belegt R x R echte Pixel (Augen, Nasen, Punkte) */
function px(g, x, y, c) {
  const X = Math.round(x) * R, Y = Math.round(y) * R;
  for (let j = 0; j < R; j++) for (let i = 0; i < R; i++) rawPx(g, X + i, Y + j, c);
}
function rect(g, x, y, w, h, c) {
  const X = Math.round(x * R), Y = Math.round(y * R);
  const W = Math.max(1, Math.round(w * R)), H = Math.max(1, Math.round(h * R));
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) rawPx(g, X + i, Y + j, c);
}
function ell(g, cx, cy, rx, ry, c) {
  if (rx <= 0 || ry <= 0) return;
  const CX = mp(cx), CY = mp(cy), RX = rx * R, RY = ry * R;
  for (let y = Math.floor(CY - RY); y <= Math.ceil(CY + RY); y++) {
    for (let x = Math.floor(CX - RX); x <= Math.ceil(CX + RX); x++) {
      const dx = (x - CX) / RX, dy = (y - CY) / RY;
      if (dx * dx + dy * dy <= 1.04) rawPx(g, x, y, c);
    }
  }
}
function tri(g, ax, ay, bx, by, cx, cy, c) {
  ax = mp(ax); ay = mp(ay); bx = mp(bx); by = mp(by); cx = mp(cx); cy = mp(cy);
  const minX = Math.floor(Math.min(ax, bx, cx)), maxX = Math.ceil(Math.max(ax, bx, cx));
  const minY = Math.floor(Math.min(ay, by, cy)), maxY = Math.ceil(Math.max(ay, by, cy));
  const sign = (x1, y1, x2, y2, x3, y3) => (x1 - x3) * (y2 - y3) - (x2 - x3) * (y1 - y3);
  for (let y = minY; y <= maxY; y++) for (let x = minX; x <= maxX; x++) {
    const d1 = sign(x, y, ax, ay, bx, by), d2 = sign(x, y, bx, by, cx, cy), d3 = sign(x, y, cx, cy, ax, ay);
    const neg = (d1 < 0) || (d2 < 0) || (d3 < 0), pos = (d1 > 0) || (d2 > 0) || (d3 > 0);
    if (!(neg && pos)) rawPx(g, x, y, c);
  }
}
function lineTo(g, x0, y0, x1, y1, c, w = 1) {
  const X0 = mp(x0), Y0 = mp(y0), X1 = mp(x1), Y1 = mp(y1), W = w * R;
  const steps = Math.max(Math.abs(X1 - X0), Math.abs(Y1 - Y0)) * 2 + 1;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, x = X0 + (X1 - X0) * t, y = Y0 + (Y1 - Y0) * t;
    if (W <= 1) rawPx(g, x, y, c);
    else for (let dy = -W / 2; dy <= W / 2; dy += .5) for (let dx = -W / 2; dx <= W / 2; dx += .5)
      if (dx * dx + dy * dy <= (W / 2) * (W / 2)) rawPx(g, x + dx, y + dy, c);
  }
}
/* Zeichnet fn(), behält das Ergebnis aber nur auf erlaubtem Untergrund.
   So bleiben Trikotstreifen im Rumpf und laufen nicht über den Rand. */
function maskedDraw(g, fn, allowed, ch) {
  const before = g.map(r => r.slice());
  fn();
  for (let y = 0; y < g.length; y++) for (let x = 0; x < g[0].length; x++)
    if (g[y][x] === ch && !allowed.includes(before[y][x])) g[y][x] = before[y][x];
}

/* Einzelnes echtes Pixel als Glanzpunkt im Auge */
function glint(g, x, y, c = '9') {
  if (R < 2) return;
  rawPx(g, Math.round(x) * R, Math.round(y) * R, c);
}

/* Automatische 8-Bit-Schattierung: Pixel an der Unterkante werden dunkler. */
function autoShade(g, from = '1', to = '2') {
  const h = g.length, w = g[0].length, out = g.map(r => r.slice());
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (g[y][x] !== from) continue;
    const below = y + R < h ? g[y + R][x] : '.';
    const right = x + R < w ? g[y][x + R] : '.';
    if (below === '.' || right === '.') out[y][x] = to;
  }
  return out;
}

/* Dunkle Kontur aussen herum — lässt die Figuren vom Hintergrund abheben */
function outline(g, ch = 'o') {
  const h = g.length, w = g[0].length, out = g.map(r => r.slice());
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (g[y][x] !== '.') continue;
    if ((y > 0 && g[y - 1][x] !== '.') || (y < h - 1 && g[y + 1][x] !== '.') ||
        (x > 0 && g[y][x - 1] !== '.') || (x < w - 1 && g[y][x + 1] !== '.')) out[y][x] = ch;
  }
  return out;
}

/* Muster: nur innerhalb der Rumpfzone (b, in Design-Einheiten),
   damit Kopf und Beine sauber bleiben */
function pattern(g, kind, c, seed = 1, b = null) {
  if (!kind || kind === 'none') return;
  const h = g.length, w = g[0].length;
  const x0 = Math.max(0, Math.floor((b ? b.x0 : 0) * R)), x1 = Math.min(w - 1, Math.ceil((b ? b.x1 : DW) * R));
  const y0 = Math.max(0, Math.floor((b ? b.y0 : 0) * R)), y1 = Math.min(h - 1, Math.ceil((b ? b.y1 : DH) * R));
  const body = (x, y) => g[y] && (g[y][x] === '1' || g[y][x] === '2' || g[y][x] === '3');
  let s = seed * 9301 + 49297;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const band = Math.max(1, Math.round(R));           /* Strichstärke */
  const gap = Math.max(2, Math.round(3 * R));        /* Periode */

  if (kind === 'stripes') {
    for (let x = x0; x <= x1; x++) {
      if ((x - x0) % gap >= band) continue;
      for (let y = y0; y <= y1; y++) if (body(x, y)) g[y][x] = c;
    }
  } else if (kind === 'spots') {
    const n = 26 * R;
    for (let i = 0; i < n; i++) {
      const x = x0 + Math.floor(rnd() * (x1 - x0 + 1)), y = y0 + Math.floor(rnd() * (y1 - y0 + 1));
      if (!body(x, y)) continue;
      const r = rnd() < .4 ? R : Math.max(1, R - 1);
      for (let j = 0; j < r; j++) for (let i2 = 0; i2 < r; i2++) if (body(x + i2, y + j)) g[y + j][x + i2] = c;
    }
  } else if (kind === 'patch') {
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x0 + (x1 - x0) * .45; x++) if (body(x, y)) g[y][x] = c;
  } else if (kind === 'band') {
    for (let y = y0; y <= y0 + Math.max(1, (y1 - y0) * .4); y++)
      for (let x = x0; x <= x1; x++) if (body(x, y)) g[y][x] = c;
  } else if (kind === 'rings') {
    const per = Math.max(3, Math.round(4 * R));
    for (let x = x0; x <= x1; x++) { if ((x - x0) % per >= 2 * band) continue; for (let y = y0; y <= y1; y++) if (body(x, y)) g[y][x] = c; }
  }
}

/* ---- Farbhelfer ---------------------------------------------------- */
function hx(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgb(a) { return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
const dark = (c, f = .38) => rgb(hx(c).map(v => v * (1 - f)));
const lite = (c, f = .34) => rgb(hx(c).map(v => v + (255 - v) * f));

/* Palette aus Grundfarbe ableiten */
function P(main, o = {}) {
  return {
    '1': main,
    '2': o.shade || dark(main),
    '3': o.belly || lite(main),
    '4': o.eye || '#14161f',
    '5': o.accent || dark(main, .6),
    '6': o.mouth || '#b33',
    '7': o.pat || dark(main, .55),
    '8': o.extra || lite(main, .6),
    '9': '#f6f6f8',
    'o': o.line || dark(main, .78)
  };
}

/* ============================================================
   2) KÖRPERBAUPLÄNE (Archetypen)
   Jedes Tier = Archetyp + Parameter + Palette.
   ============================================================ */

/* --- Vierbeiner: Hunde, Katzen, Huftiere, Dickhäuter, Nager --- */
function quad(o = {}) {
  const g = newGrid();
  const brx = o.brx ?? 6, bry = o.bry ?? 3.2;
  const legLen = o.legLen ?? 5, legW = o.legW ?? 2;
  const bx = o.bx ?? 9;
  const by = GROUND_Y - legLen - bry + 1.2;
  const hrx = o.hrx ?? 3, hry = o.hry ?? 2.8;
  const headX = o.headX ?? (bx + brx + hrx - 2.6);
  const headY = o.headY ?? (by - (o.neck ?? 2.2));
  const legTop = by + bry * 0.3;
  const xB = bx - brx * 0.62, xF = bx + brx * 0.58;

  /* Schwanz */
  const tl = o.tailLen ?? 4, tx = bx - brx + 0.5;
  if (o.tail === 'bushy') ell(g, tx - 1.6, by - 1.5, 2.4, 3, '1');
  else if (o.tail === 'thin') lineTo(g, tx, by - .5, tx - tl, by - tl, '2');
  else if (o.tail === 'tuft') { lineTo(g, tx, by - .5, tx - tl, by - tl, '2'); ell(g, tx - tl, by - tl, 1.3, 1.3, '2'); }
  else if (o.tail === 'curl') { lineTo(g, tx, by - 1, tx - 2, by - 4, '1'); lineTo(g, tx - 2, by - 4, tx + .5, by - 4.5, '1'); }
  else if (o.tail === 'stub') ell(g, tx - .5, by - 1.5, 1.4, 1.6, '1');
  else if (o.tail === 'long') lineTo(g, tx, by, tx - tl, by + 2, '2', 2);
  else if (o.tail === 'flat') { tri(g, tx, by - 1, tx - tl - 1, by - 3, tx - tl - 1, by + 3, '2'); }

  /* Hinterbeine (Schattenseite) */
  rect(g, xB - 1, legTop, legW, legLen + 1, '2');
  rect(g, xF - 1, legTop, legW, legLen + 1, '2');

  /* Rumpf */
  ell(g, bx, by, brx, bry, '1');
  if (o.hump) ell(g, bx + brx * .25, by - bry * .75, brx * .45, bry * .6, '1');
  ell(g, bx, by + bry * .5, brx * .8, bry * .45, '3');

  /* Vorderbeine */
  rect(g, xB + 1.4, legTop, legW, legLen + 1, '1');
  rect(g, xF + 1.4, legTop, legW, legLen + 1, '1');
  rect(g, xB + 1.4, GROUND_Y, legW, 1, '2');
  rect(g, xF + 1.4, GROUND_Y, legW, 1, '2');

  /* Hals + Kopf */
  tri(g, bx + brx - 1.5, by - bry + .5, headX - 1, headY + hry, bx + brx - 1, by + 1, '1');
  if (o.mane) ell(g, headX - 1.2, headY + .4, hrx + 2.1, hry + 2.1, '8');
  ell(g, headX, headY, hrx, hry, '1');

  /* Schnauze */
  const sn = o.snout ?? 2.4, snH = o.snoutH ?? 1.6, sy = headY + (o.snoutDrop ?? .6);
  if (sn > 0) { ell(g, headX + hrx - .4 + sn / 2, sy, sn / 2 + .6, snH, '1'); ell(g, headX + hrx + sn - .6, sy, 1, .9, '5'); }
  else ell(g, headX + hrx - .6, headY + .4, 1, .9, '5');

  /* Ohren */
  const eX = headX - (o.earBack ?? .3), eTop = headY - hry;
  if (o.ears === 'point') { tri(g, eX - 1.6, eTop + .6, eX - .2, eTop - 3, eX + 1, eTop + .4, '1'); tri(g, eX + 1.4, eTop + .5, eX + 2.6, eTop - 2.6, eX + 3.6, eTop + .3, '1'); }
  else if (o.ears === 'floppy') { ell(g, eX - 1.4, eTop + 2.2, 1.3, 2.6, '2'); ell(g, eX + 2.6, eTop + 2, 1.2, 2.4, '2'); }
  else if (o.ears === 'round') { ell(g, eX - 1, eTop + .2, 1.6, 1.5, '1'); ell(g, eX + 2.4, eTop, 1.5, 1.4, '1'); }
  else if (o.ears === 'long') { ell(g, eX - .4, eTop - 2.4, 1, 3.2, '1'); ell(g, eX + 2.2, eTop - 2.8, 1, 3.4, '1'); }
  else if (o.ears === 'tuft') { tri(g, eX - .6, eTop + .4, eX + .2, eTop - 3.4, eX + 1.2, eTop + .2, '1'); tri(g, eX + 2, eTop + .3, eX + 2.8, eTop - 3.2, eX + 3.8, eTop + .1, '1'); }

  /* Hörner, Geweih, Stoßzähne, Rüssel, Stacheln */
  if (o.horn === 'pair') { tri(g, headX - 1, headY - hry, headX - 2.6, headY - hry - 3.4, headX + .3, headY - hry + .4, '5'); tri(g, headX + 1.6, headY - hry, headX + 3.2, headY - hry - 3.4, headX + .4, headY - hry + .4, '5'); }
  if (o.horn === 'buffalo') for (const sgn of [-1, 1]) {
    lineTo(g, headX + sgn * 1.6, headY - hry + .4, headX + sgn * 4.2, headY - hry - 1.4, '5', 2);
    lineTo(g, headX + sgn * 4.2, headY - hry - 1.4, headX + sgn * 5.4, headY - hry + 1.6, '5', 1.6);
  }
  if (o.horn === 'nose') tri(g, headX + hrx + sn - 2.4, sy - .6, headX + hrx + sn + .4, sy - 4.6, headX + hrx + sn + .6, sy - .4, '5');
  if (o.horn === 'antler') { for (const s of [-1, 1]) { lineTo(g, headX + s * 1.4, headY - hry, headX + s * 3.4, headY - hry - 4, '5'); lineTo(g, headX + s * 2.4, headY - hry - 2, headX + s * 4.8, headY - hry - 2.6, '5'); lineTo(g, headX + s * 3.4, headY - hry - 4, headX + s * 5, headY - hry - 4.6, '5'); } }
  if (o.tusk) { lineTo(g, headX + hrx + sn - 1.5, sy + 1, headX + hrx + sn - 2.4, sy - 2.2, '9', 1); lineTo(g, headX + hrx + sn - .2, sy + 1, headX + hrx + sn + .4, sy - 2.4, '9', 1); }
  if (o.trunk) { lineTo(g, headX + hrx, headY + 1, headX + hrx + 2.4, headY + 5.4, '1', 2); lineTo(g, headX + hrx + 2.4, headY + 5.4, headX + hrx + 4, headY + 6.6, '1', 2); ell(g, headX - .5, headY + .5, hrx + .6, hry + 1.6, '2'); ell(g, headX, headY, hrx, hry, '1'); }
  if (o.spikes) for (let i = 0; i < 9; i++) { const a = Math.PI * (0.08 + 0.84 * (i / 8)); tri(g, bx + Math.cos(a) * brx * .9 - 1, by - Math.sin(a) * bry * .9, bx + Math.cos(a) * (brx + 3.4), by - Math.sin(a) * (bry + 3.6), bx + Math.cos(a) * brx * .9 + 1, by - Math.sin(a) * bry * .9, '5'); }

  pattern(g, o.pat, '7', o.seed ?? 3, { x0: bx - brx, x1: bx + brx * .95, y0: by - bry, y1: by + bry });

  /* Gesicht */
  px(g, headX + hrx - 2, headY - .6, '4'); px(g, headX + hrx - 2, headY - 1.6, '4');
  glint(g, headX + hrx - 2, headY - 1.6);
  if (o.mouth !== false) { px(g, headX + hrx + sn - 2, sy + 1.4, '6'); px(g, headX + hrx + sn - 1, sy + 1.4, '6'); }
  return outline(autoShade(g));
}

/* --- Vögel: Huhn, Gans, Krähe, Strauß, Kasuar, Adler, Pinguin --- */
function bird(o = {}) {
  const g = newGrid();
  const legLen = o.legLen ?? 5;
  const brx = o.brx ?? 4.2, bry = o.bry ?? 4.4;
  const bx = o.bx ?? 10, by = GROUND_Y - legLen - bry + 1.5;
  const hrx = o.hrx ?? 2.4, hry = o.hry ?? 2.3;
  const neck = o.neck ?? 3.6;
  const headX = bx + (o.headFwd ?? 2.6), headY = by - bry - neck + 1.5;

  /* Schwanzfedern */
  if (o.tail !== 'none') tri(g, bx - brx + 1, by - 1, bx - brx - (o.tailLen ?? 4), by - (o.tailUp ?? 4), bx - brx + 1, by + 2.5, '2');
  /* Beine */
  for (const dx of [-1.6, 1.6]) { lineTo(g, bx + dx, by + bry - 1, bx + dx + (o.legBend ?? 0), GROUND_Y, '5', o.legThick ?? 1); rect(g, bx + dx + (o.legBend ?? 0) - 1, GROUND_Y, 3, 1, '5'); }
  /* Hals */
  lineTo(g, bx + .5, by - bry + 1, headX, headY + hry, '1', o.neckThick ?? 2.4);
  /* Körper */
  ell(g, bx, by, brx, bry, '1');
  if (o.bellyPatch) ell(g, bx + .6, by + .6, brx * .62, bry * .66, '3');
  /* Flügel */
  if (o.wing !== false) ell(g, bx - .4, by - .3, brx * .66, bry * .5, '2');
  if (o.flipper) ell(g, bx + brx - 1.2, by + .6, 1.2, bry * .62, '2');
  /* Kopf */
  ell(g, headX, headY, hrx, hry, '1');
  /* Schnabel */
  const bl = o.beak ?? 3;
  if (o.hooked) { tri(g, headX + hrx - .6, headY - 1.2, headX + hrx + bl, headY - .4, headX + hrx - .4, headY + 1, '5'); tri(g, headX + hrx + bl - 1.4, headY - .2, headX + hrx + bl, headY + 2, headX + hrx + bl - 2, headY + .8, '5'); }
  else tri(g, headX + hrx - .6, headY - 1.2, headX + hrx + bl, headY + .2, headX + hrx - .6, headY + 1.4, '5');
  /* Kamm / Helm / Kehllappen */
  if (o.comb) { ell(g, headX - .4, headY - hry - .4, 1.6, 1.1, '6'); ell(g, headX + 1.2, headY - hry - .8, 1.1, 1, '6'); ell(g, headX + hrx - .6, headY + 1.8, .9, 1.2, '6'); }
  if (o.casque) tri(g, headX - 1.4, headY - hry + .4, headX + .6, headY - hry - 3.6, headX + 2, headY - hry + .2, '6');
  if (o.crest) for (let i = 0; i < 3; i++) tri(g, headX - 1 + i, headY - hry, headX - 2 + i * 1.2, headY - hry - 2.6, headX + i, headY - hry, '8');
  pattern(g, o.pat, '7', o.seed ?? 5, { x0: bx - brx, x1: bx + brx, y0: by - bry, y1: by + bry });
  px(g, headX + hrx - 2, headY - .7, '4');
  glint(g, headX + hrx - 2, headY - .7);
  if (o.brow) { px(g, headX + hrx - 3, headY - 1.9, '7'); px(g, headX + hrx - 2, headY - 1.9, '7'); px(g, headX + hrx - 1, headY - 1.6, '7'); }
  return outline(autoShade(g));
}

/* --- Schlangen --- */
function snake(o = {}) {
  const g = newGrid();
  ell(g, 10, 18, 7.4, 2.6, '1');
  ell(g, 9, 14.4, 5.6, 2.2, '1');
  ell(g, 10.5, 11.4, 3.8, 1.9, '1');
  lineTo(g, 11, 11, 14, 6.5, '1', 3);
  if (o.hood) ell(g, 14, 7, 4.4, 3.2, '2');
  ell(g, 14.6, 6, 2.6, 2.2, '1');
  lineTo(g, 17, 6.2, 21, 5.4, '6'); px(g, 21, 4.6, '6'); px(g, 21, 6.2, '6');
  pattern(g, o.pat || 'rings', '7', o.seed ?? 7, { x0: 3, x1: 17, y0: 10, y1: 21 });
  px(g, 15.4, 5.2, '4'); px(g, 13.6, 5.2, '4');
  return outline(autoShade(g));
}

/* --- Insekten: Biene, Ameise --- */
function insect(o = {}) {
  const g = newGrid();
  const y = o.y ?? 13;
  for (const dx of [-3, 0, 3]) { lineTo(g, 10 + dx, y + 2, 8 + dx, GROUND_Y, '4'); lineTo(g, 11 + dx, y + 2, 13 + dx, GROUND_Y, '4'); }
  if (o.wings) { ell(g, 9, y - 4.4, 4.4, 2.2, '9'); ell(g, 13, y - 4, 3.6, 1.9, '9'); }
  ell(g, 7, y, o.abx ?? 4.4, o.aby ?? 3.4, '1');
  ell(g, 12.4, y - .4, 2.8, 2.6, '1');
  ell(g, 16.6, y - 1, 2.4, 2.2, '1');
  lineTo(g, 17.6, y - 3, 20, y - 5.6, '4'); lineTo(g, 18.4, y - 2.2, 21, y - 3.4, '4');
  if (o.sting) tri(g, 3, y - 1, 0, y + .5, 3, y + 2, '5');
  if (o.mand) { tri(g, 18.6, y - 1.6, 21.6, y - 2.6, 19, y, '5'); tri(g, 18.6, y + .4, 21.6, y + 1.8, 19, y - .6, '5'); }
  pattern(g, o.pat, '7', o.seed ?? 11, { x0: 3, x1: 11, y0: y - 3.4, y1: y + 3.4 });
  px(g, 17.4, y - 1.8, '4'); px(g, 17.4, y - .8, '4');
  return outline(autoShade(g));
}

/* --- Spinne --- */
function spider(o = {}) {
  const g = newGrid();
  const cy = 13;
  for (let i = 0; i < 4; i++) {
    const sp = 2.4 + i * 1.9, up = 4.2 - i * .7;
    lineTo(g, 12, cy, 12 - sp, cy - up, '2'); lineTo(g, 12 - sp, cy - up, 12 - sp - 1.6, GROUND_Y, '2');
    lineTo(g, 13, cy, 13 + sp, cy - up, '2'); lineTo(g, 13 + sp, cy - up, 13 + sp + 1.2, GROUND_Y, '2');
  }
  ell(g, 8.4, cy + .4, 4.8, 4.2, '1');
  ell(g, 14, cy + .6, 3.2, 2.8, '1');
  pattern(g, o.pat, '7', 13, { x0: 4, x1: 13, y0: 9, y1: 17 });
  px(g, 15.4, cy - .6, '4'); px(g, 16.4, cy - .4, '4'); px(g, 15.4, cy + .8, '4'); px(g, 16.4, cy + .8, '4');
  if (o.hairy) for (let i = 0; i < 10; i++) { const a = Math.PI * 2 * i / 10; px(g, 8.4 + Math.cos(a) * 5.6, cy + .4 + Math.sin(a) * 5, '2'); }
  return outline(autoShade(g));
}

/* --- Skorpion --- */
function scorpion(o = {}) {
  const g = newGrid();
  const cy = 16;
  for (let i = 0; i < 3; i++) { lineTo(g, 11 + i * 2, cy + 1, 10 + i * 2, GROUND_Y, '2'); lineTo(g, 11 + i * 2, cy + 1, 12 + i * 2, GROUND_Y, '2'); }
  ell(g, 12, cy, 5, 2.6, '1');
  ell(g, 17, cy - .6, 2.6, 2.4, '1');
  for (const s of [-1.6, 1.6]) { lineTo(g, 18.4, cy - .6 + s * .6, 21, cy - 2 + s, '1', 2); ell(g, 21.6, cy - 2.6 + s, 1.8, 1.4, '5'); }
  let tx = 7.4, ty = cy - 1;
  for (let i = 0; i < 5; i++) { ell(g, tx, ty, 1.5, 1.4, '1'); tx -= .2 + i * .35; ty -= 2.1; }
  tri(g, tx - 1.6, ty + 1.4, tx + 2.6, ty - 1.6, tx + 1, ty + 2, '5');
  px(g, 18, cy - 1.4, '4'); px(g, 18, cy - .2, '4');
  return outline(autoShade(g));
}

/* --- Primaten: Gorilla, Schimpanse, Pavian --- */
function primate(o = {}) {
  const g = newGrid();
  const scale = o.scale ?? 1;
  const by = 13, bx = 11;
  const brx = (o.brx ?? 4.6) * scale, bry = (o.bry ?? 4.2) * scale;
  for (const dx of [-2.6, 2.2]) { rect(g, bx + dx, by + bry - 1, 2.6, GROUND_Y - (by + bry) + 2, '2'); rect(g, bx + dx - .6, GROUND_Y, 3.6, 1, '2'); }
  ell(g, bx, by, brx, bry, '1');
  ell(g, bx + .4, by + 1, brx * .6, bry * .5, '3');
  for (const s of [-1, 1]) { lineTo(g, bx + s * (brx - .4), by - bry + 2, bx + s * (brx + 2.4), by + bry + 1.5, '2', 2.6); ell(g, bx + s * (brx + 2.6), by + bry + 2.6, 1.5, 1.4, '2'); }
  const hy = by - bry - 2.2, hxp = bx + (o.headFwd ?? .6);
  if (o.mane) ell(g, hxp, hy, 4.4, 4, '8');
  ell(g, hxp, hy, 3, 2.8, '1');
  ell(g, hxp + 1, hy + 1.2, 2.1, 1.7, o.face || '5');
  if (o.brow) rect(g, hxp - 1.6, hy - 1.4, 5, 1, '2');
  if (o.snoutLong) { ell(g, hxp + 2.6, hy + 1.6, 2, 1.5, o.face || '5'); px(g, hxp + 4, hy + 1.2, '4'); }
  px(g, hxp - .4, hy - .2, '4'); px(g, hxp + 1.8, hy - .2, '4');
  px(g, hxp + .4, hy + 2.4, '6'); px(g, hxp + 1.4, hy + 2.4, '6');
  return outline(autoShade(g));
}

/* --- Känguru --- */
function kangaroo(o = {}) {
  const g = newGrid();
  lineTo(g, 9, 15, 2, GROUND_Y - 1, '2', 3); rect(g, 1, GROUND_Y - 1, 4, 2, '2');
  rect(g, 9, 17, 3, 3, '2'); rect(g, 8, GROUND_Y - 1, 6, 2, '2');
  ell(g, 11, 13, 4, 5, '1');
  ell(g, 11.6, 14, 2.4, 3, '3');
  lineTo(g, 13, 11, 15.4, 13.4, '2', 2);
  ell(g, 14, 6.6, 2.6, 2.4, '1');
  ell(g, 16.4, 7, 1.8, 1.2, '1'); px(g, 17.8, 6.8, '5');
  ell(g, 12.6, 3.6, 1, 2.6, '1'); ell(g, 15.2, 3.4, 1, 2.6, '1');
  px(g, 15, 6.2, '4');
  return outline(autoShade(g));
}

/* --- Krokodil / Waran --- */
function croc(o = {}) {
  const g = newGrid();
  const by = 16;
  tri(g, 8, by - 1, 0, by - 4, 8, by + 2, '2');
  for (const dx of [-5, 3]) { rect(g, 10 + dx, by + 1.6, 2, 3.6, '2'); rect(g, 10 + dx - 1, GROUND_Y, 4, 1, '2'); }
  ell(g, 11, by, 7.4, 2.4, '1');
  ell(g, 11, by + 1.4, 6.4, 1.2, '3');
  ell(g, 17, by - 1, 3, 2, '1');
  rect(g, 18.5, by - 1, 5.5, 2.2, '1');
  for (let i = 0; i < 6; i++) { px(g, 19 + i * .9, by - 1.6, '9'); px(g, 19 + i * .9, by + 1.4, '9'); }
  for (let i = 0; i < 6; i++) tri(g, 5 + i * 1.8, by - 2, 6 + i * 1.8, by - 4.2, 7 + i * 1.8, by - 2, '2');
  if (o.tongue) lineTo(g, 19, by + .2, 23, by + 1.6, '6');
  px(g, 17.4, by - 2.4, '4'); px(g, 16.2, by - 2.4, '4');
  return outline(autoShade(g));
}

/* --- Mensch: unsere Kämpfer ------------------------------------------
   Palette hier: 1=Shirt 2=Shirt dunkel 3=Haut 4=Linien/Augen 5=Haare
                 6=Hose 7=Schuhe 8=Accessoire 9=Weiss                  */
function human(o = {}) {
  const g = newGrid();
  const cx = 12;
  const w = o.build === 'big' ? 4.4 : o.build === 'slim' ? 3.1 : 3.8;
  const headY = (o.tall ? 4.4 : 5.4);
  const hr = 3.1, hrv = 3.3;
  const sh = headY + 4.4;
  const hip = sh + 5.6;

  /* Beine + Schuhe */
  const legL = cx - w + .2, legR = cx + w - 3;
  if (o.shorts) {
    const shortLen = Math.max(2, (GROUND_Y - hip) * .5);
    rect(g, legL, hip, 2.8, shortLen, '6');
    rect(g, legR, hip, 2.8, shortLen, '6');
    rect(g, legL + .3, hip + shortLen, 2.3, GROUND_Y - hip - shortLen, '3');
    rect(g, legR + .3, hip + shortLen, 2.3, GROUND_Y - hip - shortLen, '3');
    if (o.socks) { rect(g, legL + .3, GROUND_Y - 2, 2.3, 2, '9'); rect(g, legR + .3, GROUND_Y - 2, 2.3, 2, '9'); }
  } else {
    rect(g, legL, hip, 2.8, GROUND_Y - hip, '6');
    rect(g, legR, hip, 2.8, GROUND_Y - hip, '6');
  }
  rect(g, cx - w - .4, GROUND_Y, 3.8, 2, '7');
  rect(g, cx + w - 3.4, GROUND_Y, 3.8, 2, '7');
  rect(g, cx - w - .4, GROUND_Y + 1.5, 3.8, .5, '4');   /* Sohle */
  rect(g, cx + w - 3.4, GROUND_Y + 1.5, 3.8, .5, '4');

  /* Rumpf */
  rect(g, cx - w, sh, w * 2, hip - sh + 1, '1');
  rect(g, cx - w, hip - 1, w * 2, 1, '2');
  rect(g, cx - 1.4, sh - .3, 2.8, .7, '2');            /* Kragen */


  /* Arme — bei kurzen Aermeln liegt der Unterarm frei */
  const slv = o.shortSleeve ? 2 : 4.2;
  const sleeveCol = o.jacket ? 'i' : '1';
  rect(g, cx - w - 2.2, sh, 2.2, slv, sleeveCol);
  rect(g, cx + w, sh, 2.2, slv, sleeveCol);
  if (o.shortSleeve) {
    rect(g, cx - w - 2, sh + slv, 1.9, 4.2 - slv, '3');
    rect(g, cx + w + .1, sh + slv, 1.9, 4.2 - slv, '3');
  }
  ell(g, cx - w - 1.1, sh + 4.8, 1.3, 1.3, '3');
  ell(g, cx + w + 1.1, sh + 4.8, 1.3, 1.3, '3');

  /* Stoffmuster liegt über Rumpf UND Ärmeln */
  if (o.shirtPat === 'diag') {
    maskedDraw(g, () => {
      for (const off of [-2.6, .6, 3.8]) lineTo(g, cx - w - 1 + off, hip + 1, cx - w + 3.4 + off, sh - 1, 'd', 1.6);
    }, ['1', '2'], 'd');
    maskedDraw(g, () => {
      for (const off of [-1.4, 1.8, 5]) lineTo(g, cx - w - 1 + off, hip + 1, cx - w + 3.4 + off, sh - 1, 'e', .7);
    }, ['1', '2', 'd'], 'e');
  } else if (o.shirtPat === 'stripes') {
    maskedDraw(g, () => {
      for (let i = -w; i < w; i += 2.4) rect(g, cx + i, sh, 1.2, hip - sh + 1, 'd');
    }, ['1', '2'], 'd');
  } else if (o.shirtPat === 'check') {          /* Karohemd */
    const x0 = cx - w - 2.4, x1 = cx + w + 2.4, y1 = hip + 1;
    maskedDraw(g, () => {
      for (let i = x0; i <= x1; i += 3.6) rect(g, i, sh - 1, .8, y1 - sh + 2, 'd');
      for (let j = sh; j <= y1; j += 3.6) rect(g, x0, j, x1 - x0, .8, 'd');
    }, ['1', '2'], 'd');
    maskedDraw(g, () => {
      for (let i = x0 + 1.8; i <= x1; i += 3.6) rect(g, i, sh - 1, .45, y1 - sh + 2, 'e');
      for (let j = sh + 1.8; j <= y1; j += 3.6) rect(g, x0, j, x1 - x0, .45, 'e');
    }, ['1', '2', 'd'], 'e');
  } else if (o.shirtPat === 'panel') {          /* andersfarbige Partie auf einer Seite */
    maskedDraw(g, () => {
      rect(g, cx - w - 2.4, sh, w * .75 + 2.4, (hip - sh) * .62, 'd');
    }, ['1', '2'], 'd');
  }
  if (o.sash) {                                  /* Bauchbinde */
    rect(g, cx - w, hip - 3.4, w * 2, 1.9, 'l');
    rect(g, cx - w, hip - 3.4, w * 2, .35, dark('#000') === '#000' ? 'e' : 'e');
    for (let i = -w + .8; i < w; i += 1.6) px(g, cx + i, hip - 2.7, 'k');
  }
  if (o.jacket) {                                /* offener Janker über dem Hemd */
    rect(g, cx - w, sh - .4, w - 1.1, hip - sh + 1.4, 'i');
    rect(g, cx + 1.1, sh - .4, w - 1.1, hip - sh + 1.4, 'i');
    tri(g, cx - w + .4, sh - .4, cx - 1.1, sh - .4, cx - 1.1, sh + 2.6, '2');
    tri(g, cx + w - .4, sh - .4, cx + 1.1, sh - .4, cx + 1.1, sh + 2.6, '2');
    px(g, cx - w + 1.4, sh + 4.4, '4'); px(g, cx + w - 1.8, sh + 4.4, '4');
  }
  if (o.hood) {                                  /* Kapuze im Nacken */
    ell(g, cx, sh - .2, w + 1.5, 2.3, '2');
    ell(g, cx, sh - .9, w - .4, 1.5, '1');
    rect(g, cx - 1.6, sh + 1.4, .5, 2.6, '9');   /* Kordel */
    rect(g, cx + 1.2, sh + 1.4, .5, 2.6, '9');
  }

  if (o.watch) { rect(g, cx + w + .1, sh + 3.6, 1.9, 1.4, '4'); px(g, cx + w + 1, sh + 4, 'g'); }
  if (o.tattoo) {                                       /* tätowierter Unterarm */
    maskedDraw(g, () => {
      ell(g, cx + w + 1, sh + 2.8, .8, .7, 'f');
      ell(g, cx + w + 1.4, sh + 4, .6, .6, 'f');
      px(g, cx + w + .4, sh + 3.4, 'f');
    }, ['3'], 'f');
  }

  /* Hals + Kopf */
  rect(g, cx - 1, headY + 2.4, 2, 2.2, '3');
  ell(g, cx, headY, hr, hrv, '3');

  /* Haare */
  const hs = o.hairStyle || 'short';
  if (hs !== 'bald') {
    if (hs === 'cap') { ell(g, cx, headY - 2, hr + .3, 1.9, '8'); rect(g, cx - .4, headY - .9, hr + 2.6, .9, '8'); }
    else {
      if (hs === 'buzz') ell(g, cx, headY - 2.7, hr - .1, 1.3, '5');
      else ell(g, cx, headY - 2.5, hr + .15, 1.75, '5');
      if (hs === 'fringe') {
        ell(g, cx, headY - 2.3, hr + .25, 1.8, '5');
        tri(g, cx - hr - .4, headY - 2.7, cx + hr + .4, headY - 3.1, cx - hr + 1.6, headY - .7, '5');
        rect(g, cx + hr - 1.1, headY - 2.7, 1.4, 2.1, '5');
      }
      if (hs === 'long') { rect(g, cx - hr - .4, headY - 2, 1.6, 6.8, '5'); rect(g, cx + hr - 1.2, headY - 2, 1.6, 6.8, '5'); }
      if (hs === 'bun') ell(g, cx - .4, headY - 4.4, 1.7, 1.5, '5');
      if (hs === 'curly') { for (let i = -3; i <= 3; i++) ell(g, cx + i * 1.05, headY - 3 - (i % 2 ? .7 : 0), 1.2, 1.1, '5'); }
      if (hs === 'mohawk') rect(g, cx - 1, headY - 5.8, 2.2, 3.2, '5');
      if (hs === 'wild') { for (let i = -3; i <= 3; i++) tri(g, cx + i * 1.1, headY - 2.4, cx + i * 1.3, headY - 5.6, cx + i * 1.1 + 1.2, headY - 2.4, '5'); }
    }
  }
  if (o.hat === 'tracht') {                      /* Trachtenhut mit Kordel und Feder */
    ell(g, cx, headY - 2.5, hr + 2.5, 1, 'j');                 /* Krempe */
    rect(g, cx - hr + .1, headY - 4.4, (hr - .1) * 2, 2.2, 'j');/* Kopfteil */
    ell(g, cx, headY - 4.5, hr - .1, 1.4, 'j');
    rect(g, cx - hr + .1, headY - 3.2, (hr - .1) * 2, .8, 'k'); /* Kordel */
    rect(g, cx - 1, headY - 5.4, 2, .8, '4');                   /* Delle */
    tri(g, cx + hr - .4, headY - 3.4, cx + hr + 1.8, headY - 6, cx + hr + .6, headY - 3.1, '9');
    lineTo(g, cx + hr + .2, headY - 3.4, cx + hr + 1.6, headY - 5.8, 'k');
  }

  /* Bart */
  if (o.beard === 'full') { ell(g, cx, headY + 2.7, hr - .35, 1.7, 'h'); rect(g, cx - 1.1, headY + 2.2, 2.4, .9, '3'); }
  else if (o.beard === 'stubble') {
    const bx0 = Math.round((cx - 2.7) * R), bx1 = Math.round((cx + 2.7) * R);
    const by0 = Math.round((headY + 1.6) * R), by1 = Math.round((headY + 3.4) * R);
    for (let Y = by0; Y <= by1; Y++) for (let X = bx0; X <= bx1; X++)
      if ((X + Y) % 2 === 0 && g[Y] && g[Y][X] === '3') g[Y][X] = 'h';
  }
  else if (o.beard === 'goatee') rect(g, cx - 1.2, headY + 2.6, 2.6, 1.8, 'h');
  else if (o.beard === 'moustache') { rect(g, cx - 1.7, headY + 1.8, 3.5, 1.1, 'h'); px(g, cx - 2, headY + 2.1, 'h'); px(g, cx + 1.7, headY + 2.1, 'h'); }

  /* Gesicht */
  ell(g, cx - hr + .2, headY + .9, .9, 1.1, '3');     /* Ohr */
  px(g, cx - hr + .1, headY + .9, 'c');
  if (o.earring) px(g, cx - hr + .2, headY + 1.9, 'g');
  px(g, cx - 1.5, headY + .3, '4'); px(g, cx + 1.5, headY + .3, '4');
  glint(g, cx - 1.5, headY + .3); glint(g, cx + 1.5, headY + .3);
  px(g, cx, headY + 1.2, 'c');                         /* Nase */
  const mouthY = headY + (o.beard === 'moustache' ? 3 : 2.1);
  px(g, cx - .5, mouthY, '4'); px(g, cx + .5, mouthY, '4');
  rect(g, cx - 1, headY + 3.3, 2, .5, 'c');            /* Hals-Schatten */
  if (o.glasses) {                                      /* kräftiger Rahmen */
    rect(g, cx - 3, headY - .8, 2.9, 2.6, '4');
    rect(g, cx + .1, headY - .8, 2.9, 2.6, '4');
    rect(g, cx - 2.6, headY - .4, 2.1, 1.8, '9');
    rect(g, cx + .5, headY - .4, 2.1, 1.8, '9');
    px(g, cx - 1.6, headY + .3, '4'); px(g, cx + 1.4, headY + .3, '4');
    rect(g, cx - .2, headY - .2, .6, .7, '4');
    rect(g, cx - 3.4, headY - .4, .5, .7, '4'); rect(g, cx + 2.9, headY - .4, .5, .7, '4');
  }
  if (o.shades) {   /* dunkle Sonnenbrille — verdeckt die Augen */
    rect(g, cx - 2.5, headY, 2, 1.6, 'b');
    rect(g, cx + .6, headY, 2, 1.6, 'b');
    px(g, cx - .5, headY + .4, '4'); px(g, cx + .5, headY + .4, '4');
  }
  if (o.bag) {      /* Umhaengetasche quer ueber die Brust */
    lineTo(g, cx + w - .6, sh - .4, cx - w + 1.4, sh + 4.4, 'a');
    lineTo(g, cx + w - .6, sh - .2, cx - w + 1.4, sh + 4.6, 'a');
    rect(g, cx - w - .4, sh + 4, 3.4, 3.4, 'a');
    rect(g, cx - w - .2, sh + 5.2, 3, .9, '4');
  }
  if (o.logo) rect(g, cx - 1.4, sh + 1.4, 3, 2, '9');
  return outline(autoShade(g, '1', '2'));
}

/* ============================================================
   3) SPRITE-CACHE / ZEICHNEN
   ============================================================ */
const spriteCache = new Map();
function buildSprite(grid, pal) {
  const c = document.createElement('canvas');
  c.width = grid[0].length; c.height = grid.length;
  const x = c.getContext('2d');
  for (let y = 0; y < grid.length; y++) for (let i = 0; i < grid[0].length; i++) {
    const ch = grid[y][i]; if (ch === '.') continue;
    x.fillStyle = pal[ch] || pal['1'] || '#f0f'; x.fillRect(i, y, 1, 1);
  }
  return c;
}
function flipCanvas(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0); return c;
}
function whiten(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  return c;
}
/* Liefert {base, flip, flash, flashFlip} */
function getSprite(def) {
  if (spriteCache.has(def.id)) return spriteCache.get(def.id);
  const grid = def.build();
  const base = buildSprite(grid, def.pal);
  let top = 0;
  for (let y = 0; y < grid.length; y++) { if (grid[y].some(c => c !== '.')) { top = y; break; } }
  const rec = { base, flip: flipCanvas(base), flash: whiten(base), top };
  rec.flashFlip = flipCanvas(rec.flash);
  spriteCache.set(def.id, rec);
  return rec;
}
function drawSprite(ctx, def, x, y, scale, faceLeft, flash) {
  const s = getSprite(def);
  const img = flash ? (faceLeft ? s.flashFlip : s.flash) : (faceLeft ? s.flip : s.base);
  ctx.drawImage(img, Math.round(x - img.width * scale / 2), Math.round(y - img.height * scale), img.width * scale, img.height * scale);
}

];
const ITEM_BY_ID = id => ITEMS.find(i => i.id === id) || ITEMS[0];

/* ============================================================
   6) KAMPF-MATHEMATIK
   ============================================================ */
const TUNE = { mitig: 22, cleaveChain: 3, baseRate: 0.048 };
const LUCK = { miss: .07, lucky: .06, luckyMult: 2.5 };  /* ein bisschen Glueck muss sein */
const SWEEP_RATIO = .62;   /* ab wann gilt ein Gegner als "deutlich kleiner" */

function animalStats(a) {
  const kg = Math.max(a.kg, 0.0005), fun = a.fun || 1;
  return {
    hp: Math.max(4, Math.round((1 + Math.pow(kg, .7) * 6) * fun)),
    atk: Math.max(1, Math.round((1.5 + Math.pow(kg, .42) * 2 + Math.pow(Math.max(a.bite, 1), .42) * .75 + a.aggr * .45) * fun)),
    def: Math.round(Math.pow(kg, .3) * 1.8 + (a.armor || 0) * 6 + 1),
    spd: Math.round(4 + a.kmh * .12 + a.aggr * .5)
  };
}
const statsOf = d => d.human ? { hp: d.hp, atk: d.atk, def: d.def, spd: d.spd } : animalStats(d);
/* Wie viele Gegner können gleichzeitig an einen ran? Grosse Ziele = mehr Platz. */
/* Körpergrösse als lineares Mass (Kantenlänge ~ Kubikwurzel der Masse) */
const HUMAN_KG = 80;
const sizeOf = d => Math.cbrt(Math.max(d.human ? HUMAN_KG : (d.kg ?? 1), 1e-6));
/* Optische Grösse: ein Elefant ist kein Chihuahua */
const visOf = d => Math.max(.5, Math.min(1.8, .5 + .55 * sizeOf(d) / Math.cbrt(HUMAN_KG)));

/* Wie viele Angreifer DIESER Grösse passen gleichzeitig um ein Ziel JENER Grösse?
   Kreispackung: n = PI / asin(rA/(rT+rA)), abgedämpft fürs Spielgefühl. */
function engageSlots(target, attacker) {
  const rT = target.size, rA = attacker.size;
  const n = Math.PI / Math.asin(Math.min(.999, rA / (rT + rA)));
  return Math.max(1, Math.min(9, Math.round(n * .45)));
}
const mitigate = (atk, df) => atk * (1 - df / (df + TUNE.mitig));

let _uid = 0;
function makeUnit(def, side, itemId) {
  const s = statsOf(def);
  const item = ITEM_BY_ID(itemId), m = item.mod || {};
  return {
    item, im: m,
    uid: ++_uid, name: def.name, side, def, src: def, human: !!def.human,
    size: sizeOf(def), vis: visOf(def), passive: def.passive || null,
    maxHp: s.hp + (m.hp || 0), hp: s.hp + (m.hp || 0),
    atk: s.atk + (m.atk || 0), dfn: s.def + (m.def || 0),
    spd: Math.max(3, s.spd + (m.spd || 0)),
    x: 0, y: 0, tx: 0, ty: 0, target: null, cd: Math.random() * .6,
    alive: true, flash: 0, bob: Math.random() * 6.28, lunge: 0, kills: 0, dealt: 0
  };
}

/* Eine Kampfwelt. renderloses Steppen ist möglich -> Balancing-Tests. */
function createWorld(teamDefs, enemyList) {
  const units = [];
  teamDefs.forEach(d => {
    /* Akzeptiert {def, item} aus dem Setup ebenso wie einen nackten Kämpfer.
       Unterschieden wird über build() — ein Kämpfer hat eins, der Wrapper nicht.
       (d.def wäre hier zweideutig: bei einem Kämpfer ist das der DEF-Wert.) */
    const def = (d && typeof d.build === 'function') ? d : d.def;
    units.push(makeUnit(def, 0, d.item));
  });
  enemyList.forEach(({ def, n }) => { for (let i = 0; i < n; i++) units.push(makeUnit(def, 1)); });
  layout(units);
  return {
    units, t: 0, log: [], fx: [], over: false, winner: null, started: false,
    stats: { hits: 0, kos: 0, specials: 0, crit: 0, lucky: 0, miss: 0, dodge: 0, block: 0, dmg: 0,
             best: { v: 0, by: '', on: '', kind: '' } }
  };
}

function layout(units) {
  [0, 1].forEach(side => {
    const list = units.filter(u => u.side === side);
    const perCol = Math.max(1, Math.ceil(Math.sqrt(list.length * 1.6)));
    list.forEach((u, i) => {
      const col = Math.floor(i / perCol), row = i % perCol;
      const depth = list.length === 1 ? .5 : row / Math.max(1, perCol - 1);
      u.y = .18 + depth * .64 + (Math.random() - .5) * .06;
      const edge = side === 0 ? 0.10 : 0.90, dir = side === 0 ? 1 : -1;
      u.x = edge - dir * col * 0.055 - dir * Math.random() * .02;
      u.tx = u.x; u.ty = u.y;
    });
  });
}

function enemiesOf(w, u) { return w.units.filter(o => o.alive && o.side !== u.side); }

function pickTarget(w, u) {
  const foes = enemiesOf(w, u);
  if (!foes.length) return null;
  const load = new Map();
  w.units.forEach(o => { if (o.alive && o.target) load.set(o.target.uid, (load.get(o.target.uid) || 0) + 1); });
  let best = null, bestScore = Infinity;
  for (const f of foes) {
    const d = Math.hypot(f.x - u.x, (f.y - u.y) * .35);
    const busy = (load.get(f.uid) || 0) >= engageSlots(f, u) ? 0.55 : 0;
    const sc = d + busy;
    if (sc < bestScore) { bestScore = sc; best = f; }
  }
  return best;
}

function applyDamage(w, atk, tgt, raw, tag) {
  let dmg = Math.max(1, Math.round(raw));
  if (dmg > w.stats.best.v) w.stats.best = { v: dmg, by: atk.name, on: tgt.name, kind: tag };
  let chain = 0, cur = tgt;
  while (cur && chain <= TUNE.cleaveChain) {
    const take = Math.min(dmg, cur.hp);
    cur.hp -= take; dmg -= take; atk.dealt += take; cur.taken = (cur.taken || 0) + take;
    w.stats.dmg += take;
    cur.flash = .09;
    w.fx.push({ k: 'dmg', x: cur.x + (Math.random() - .5) * .03, y: cur.y, v: take,
                crit: tag === 'crit' || tag === 'special', sp: tag === 'special', life: .9 });
    if (cur.hp <= 0) {
      cur.hp = 0; cur.alive = false; cur.target = null; atk.kills++; w.stats.kos++;
      w.lastKO = { x: cur.x, y: cur.y };
      w.fx.push({ k: 'poof', x: cur.x, y: cur.y, life: .5 });
      w.log.push({ c: 'ko', s: `${cur.name} ist K.O.!` });
    }
    if (dmg <= 0) break;
    /* Überschuss-Schaden trifft den nächsten (Rundum-Tritt) */
    const near = enemiesOf(w, atk).filter(o => o !== cur && o.alive && o.size < SWEEP_RATIO * atk.size &&
      Math.hypot(o.x - atk.x, (o.y - atk.y) * .35) < .06 + (atk.size + o.size) * .011);
    cur = near[0] || null; chain++;
  }
}

/* Verteidiger-Passive: wie viel Schaden kommt bei DIESEM Ziel an? */
const defMod = o => o.passive === 'zaeh' ? .82 : 1;

/* Der Schreihals buffed Verbündete in der Nähe */
function supportAura(w, u) {
  let m = 1;
  for (const o of w.units) {
    if (!o.alive || o === u || o.side !== u.side) continue;
    if (o.im.aura) m += o.im.aura;                       /* Trillerpfeife wirkt teamweit */
    if (o.passive === 'support' && Math.hypot(o.x - u.x, (o.y - u.y) * .4) < .2) m += .14;
  }
  return m;
}

function doAttack(w, u) {
  const t = u.target; if (!t || !t.alive) return;
  u.lunge = .22;
  const pas = u.passive;
  const luckMul = pas === 'chaos' ? 2 : 1;   /* Chaos hat mehr Glück UND mehr Pech */

  /* Pech: voll danebengehauen */
  if (Math.random() < LUCK.miss * luckMul) {
    w.stats.miss++;
    w.fx.push({ k: 'txt', x: u.x, y: u.y, s: 'DANEBEN', col: '#8fa3c8', life: .7 });
    if (Math.random() < .25) w.log.push({ c: '', s: `${u.name} haut komplett daneben.` });
    return;
  }
  /* Der Blitz weicht aus */
  const dodgeCh = (t.passive === 'flink' ? .14 : 0) + (t.im.dodge || 0);
  if (dodgeCh > 0 && Math.random() < dodgeCh) {
    w.stats.dodge++;
    w.fx.push({ k: 'txt', x: t.x, y: t.y, s: 'AUSGEWICHEN', col: '#3cbcfc', life: .7 });
    if (Math.random() < .3) w.log.push({ c: 'spc', s: `${t.name} weicht ${u.name} aus.` });
    return;
  }
  /* Die Wand blockt */
  let blockMul = 1;
  const blockCh = (t.passive === 'wand' ? .22 : 0) + (t.im.block || 0);
  if (blockCh > 0 && Math.random() < blockCh) {
    blockMul = .12; w.stats.block++;
    w.fx.push({ k: 'txt', x: t.x, y: t.y, s: 'BLOCK', col: '#fcd000', life: .7 });
  }

  const sp = u.def.special;
  const isSpecial = sp && Math.random() < sp.c;
  const critChance = (pas === 'taktiker' ? .26 : .1) + (u.im.crit || 0);
  const crit = !isSpecial && Math.random() < critChance;
  const lucky = !isSpecial && !crit && Math.random() < LUCK.lucky * luckMul * (u.im.luck || 1);

  let atkVal = u.atk * supportAura(w, u);
  if (pas === 'comeback') atkVal *= 1 + (1 - u.hp / u.maxHp) * .9;
  if (pas === 'onepunch') atkVal *= 2.6;

  const spread = pas === 'chaos' ? (.4 + Math.random() * 1.5) : (.85 + Math.random() * .3);
  let raw = mitigate(atkVal, t.dfn) * spread * blockMul;
  if (isSpecial) raw *= sp.m;
  else if (crit) raw *= pas === 'brecher' ? 2.5 : 1.8;
  else if (lucky) raw *= LUCK.luckyMult;

  w.stats.hits++;
  if (isSpecial) w.stats.specials++; else if (crit) w.stats.crit++; else if (lucky) w.stats.lucky++;
  applyDamage(w, u, t, raw * defMod(t), isSpecial ? 'special' : (crit || lucky) ? 'crit' : 'hit');

  /* Rundumschlag: trifft nur GEGNER, die deutlich kleiner sind als der Angreifer.
     Ein Mensch tritt drei Chihuahuas weg — aber keine drei Wölfe.
     Umgekehrt erwischt ein Elefant mit dem Rüssel mehrere Menschen. */
  const sweepMax = SWEEP_RATIO * u.size;
  if (t.size < sweepMax) {
    const tiny = t.size < .35 * u.size;
    const bonus = pas === 'sweeper' ? 1 : 0, reach = pas === 'sweeper' ? 1.6 : 1;
    const many = (tiny ? 3 : 2) + bonus + (u.im.sweep || 0), mult = tiny ? 1 : .6;
    enemiesOf(w, u)
      .filter(o => o !== t && o.size < sweepMax &&
        Math.hypot(o.x - u.x, (o.y - u.y) * .35) < (.05 + (u.size + o.size) * .009) * reach)
      .slice(0, many)
      .forEach(o => applyDamage(w, u, o, raw * mult * defMod(o), 'sweep'));
  }

  /* Stacheldraht-Weste: ein Teil kommt zurück */
  if (t.im.thorns && t.alive) {
    applyDamage(w, t, u, raw * t.im.thorns, 'thorns');
    if (Math.random() < .15) w.log.push({ c: 'spc', s: `${u.name} greift ${t.name} an und tut sich selbst weh.` });
  }

  if (isSpecial) w.log.push({ c: 'spc', s: `★ ${sp.n}: ` + sp.t.replace(/\$A/g, u.name).replace(/\$B/g, t.name) });
  else if (lucky) w.log.push({ c: 'hit', s: `Glückstreffer! ${u.name} erwischt ${t.name} genau richtig.` });
  else if (crit) w.log.push({ c: 'hit', s: `${u.name} landet einen KRITISCHEN Treffer auf ${t.name}!` });
  else if (Math.random() < .1) w.log.push({ c: '', s: `${u.name} trifft ${t.name}.` });
}

function step(w, dt) {
  if (w.over) return;
  w.t += dt;
  const inReach = new Map();   /* Ziel -> Angreifer in Reichweite */

  for (const u of w.units) {
    if (!u.alive) continue;
    u.flash = Math.max(0, u.flash - dt);
    u.lunge = Math.max(0, u.lunge - dt * 3.2);
    if (!u.target || !u.target.alive) u.target = pickTarget(w, u);
    const t = u.target; if (!t) { u.waiting = false; continue; }
    const dx = t.x - u.x, dy = t.y - u.y;
    const dist = Math.hypot(dx, dy * .4) || 1e-6;
    const reach = .034 + (u.size + t.size) * .0065 + (u.im.reach || 0) + (u.waiting ? .02 : 0);
    u._reach = reach;
    if (dist > reach) {
      const v = (0.10 + u.spd * 0.013) * dt;
      u.x += (dx / dist) * v; u.y += (dy / dist) * v * .5;
      u.y = Math.max(.1, Math.min(.88, u.y));
      u.waiting = false;
    } else {
      if (!inReach.has(t)) inReach.set(t, []);
      inReach.get(t).push({ u, dist });
    }
  }

  /* Nur so viele duerfen gleichzeitig ran, wie um das Ziel herum Platz haben.
     Das ist der Grund, warum ein Mensch 20 Chihuahuas ueberleben kann. */
  for (const [t, list] of inReach) {
    list.sort((a, b) => a.dist - b.dist);
    let capacity = 1;
    list.forEach((e) => {
      const u = e.u;
      const cost = 1 / engageSlots(t, u);
      const fits = capacity - cost >= -1e-9;
      if (fits) capacity -= cost;
      if (fits) {
        u.waiting = false;
        u.cd -= dt;
        if (u.cd <= 0) { doAttack(w, u); u.cd = Math.max(.3, 1 / (TUNE.baseRate * u.spd + .26)) * (u.passive === 'onepunch' ? 2 : 1); }
      } else {
        /* kein Platz: auf den Aussenring zurueckweichen und dort herumtigern */
        u.waiting = true;
        const dx2 = t.x - u.x, dy2 = t.y - u.y;
        const d2 = Math.hypot(dx2, dy2 * .4) || 1e-6;
        const stand = (u._reach || .08) * 2.1;
        if (d2 < stand) {
          const back = (0.07 + u.spd * .008) * dt;
          u.x -= (dx2 / d2) * back; u.y -= (dy2 / d2) * back * .5;
        }
        const ang = (u.uid * 1.7 + w.t * 1.3);
        u.x += Math.cos(ang) * .0025; u.y += Math.sin(ang) * .0018;
        u.y = Math.max(.1, Math.min(.88, u.y));
      }
    });
  }

  /* Separation: Körper gehen nicht durcheinander durch. Erzeugt den Ring
     um ein grosses Ziel statt eines Haufens auf einem Pixel. */
  const live = w.units.filter(u => u.alive);
  for (let i = 0; i < live.length; i++) {
    const a1 = live[i];
    for (let j = i + 1; j < live.length; j++) {
      const b1 = live[j];
      const dx = b1.x - a1.x, dy = (b1.y - a1.y) * .38;
      const d = Math.hypot(dx, dy);
      const minD = .022 + (a1.size + b1.size) * .0072;
      if (d < minD && d > 1e-5) {
        const push = (minD - d) * .5, nx = dx / d, ny = dy / d;
        const wa = b1.size / (a1.size + b1.size), wb = 1 - wa;
        a1.x -= nx * push * wa * 2; a1.y -= ny * push * wa * 4;
        b1.x += nx * push * wb * 2; b1.y += ny * push * wb * 4;
      }
    }
  }
  for (const u of live) { u.x = Math.max(.03, Math.min(.97, u.x)); u.y = Math.max(.1, Math.min(.88, u.y)); }

  for (let i = w.fx.length - 1; i >= 0; i--) { w.fx[i].life -= dt; if (w.fx[i].life <= 0) w.fx.splice(i, 1); }
  const a = w.units.some(u => u.alive && u.side === 0), b = w.units.some(u => u.alive && u.side === 1);
  if (!a || !b) { w.over = true; w.winner = a ? 0 : b ? 1 : -1; }
}

/* Headless-Simulation für Balancing (keine Grafik). */
function fastSim(teamDefs, enemyList, maxT = 180) {
  const w = createWorld(teamDefs, enemyList);
  while (!w.over && w.t < maxT) step(w, 1 / 30);
  return w;
}
window.fastSim = fastSim; window.ANIMALS = ANIMALS; window.FIGHTERS = FIGHTERS;

/* ============================================================
   6b) SOUND
   Alles per WebAudio erzeugt — keine Dateien, die Seite bleibt
   eine einzelne HTML. Der AudioContext wird erst beim ersten
   Klick geöffnet, sonst blockt ihn der Browser.
   ============================================================ */
const SFX = (() => {
  let ac = null, master = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('ab_mute') === '1'; } catch (e) {}
  let lastHit = 0;

  function ctx() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain(); master.gain.value = .2; master.connect(ac.destination);
      const n = ac.sampleRate * .3;
      noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  function tone(freq, dur, type = 'square', vol = 1, slideTo = 0, delay = 0) {
    if (muted) return; const a = ctx(); if (!a) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + .006);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .03);
  }
  function noise(dur, vol = 1, cut = 1600, delay = 0) {
    if (muted) return; const a = ctx(); if (!a) return;
    const t0 = a.currentTime + delay;
    const src = a.createBufferSource(); src.buffer = noiseBuf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cut, t0);
    const g = a.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t0); src.stop(t0 + dur + .02);
  }

  return {
    get muted() { return muted; },
    toggle() {
      muted = !muted;
      try { localStorage.setItem('ab_mute', muted ? '1' : '0'); } catch (e) {}
      if (!muted) { const a = ctx(); if (a) tone(880, .07, 'square', .5); }
      return muted;
    },
    /* Treffer: Tonhöhe sinkt mit dem Schaden, gedrosselt damit ein
       Schwarm nicht in Krach ausartet */
    hit(dmg) {
      const a = ctx(); if (!a) return;
      if (a.currentTime - lastHit < .045) return;
      lastHit = a.currentTime;
      const f = 300 - Math.min(180, dmg * 3.2);
      tone(f + 120, .06, 'square', .5, f * .6);
      noise(.05, .25, 2400);
    },
    crit() { tone(520, .05, 'square', .55, 300); tone(880, .1, 'square', .5, 520, .05); noise(.09, .4, 3200); },
    special() { [660, 830, 990, 1320].forEach((f, i) => tone(f, .08, 'square', .45, 0, i * .05)); },
    block() { tone(1400, .04, 'square', .4); tone(900, .05, 'square', .3, 600, .04); },
    dodge() { tone(1200, .07, 'sine', .35, 2000); },
    miss() { tone(140, .1, 'triangle', .35, 80); },
    ko() { tone(320, .26, 'square', .5, 70); noise(.22, .35, 900, .02); },
    fight() { [440, 587, 880].forEach((f, i) => tone(f, .12, 'square', .5, 0, i * .1)); },
    win() { [523, 659, 784, 1047, 1047].forEach((f, i) => tone(f, i === 4 ? .4 : .13, 'square', .5, 0, i * .12)); },
    lose() { [440, 392, 330, 247].forEach((f, i) => tone(f, i === 3 ? .5 : .17, 'triangle', .5, 0, i * .16)); },
    finish() { tone(180, .5, 'square', .55, 60); noise(.4, .3, 700); },
    ui() { tone(660, .04, 'square', .3); }
  };
})();
